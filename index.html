<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CIBERDEFESA — Jogo de Segurança Digital</title>
<style>
:root{
  --bg:#05010f; --cyan:#00f0ff; --blue:#2b6bff; --purple:#a855f7; --pink:#ff3ea5;
  --green:#25f4a7; --red:#ff3b5c; --yellow:#ffd93d; --txt:#e8ecff; --glass:rgba(255,255,255,.05);
  --stroke:rgba(0,240,255,.25);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:
    radial-gradient(circle at 15% 10%, rgba(168,85,247,.20), transparent 45%),
    radial-gradient(circle at 85% 15%, rgba(0,240,255,.16), transparent 45%),
    radial-gradient(circle at 50% 100%, rgba(255,62,165,.12), transparent 55%), var(--bg);
  color:var(--txt);font-family:'Segoe UI',Roboto,system-ui,-apple-system,sans-serif;
  min-height:100vh;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(0,240,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.055) 1px,transparent 1px);
  background-size:44px 44px;animation:grid 22s linear infinite;
}
@keyframes grid{to{background-position:44px 44px,44px 44px}}
.wrap{position:relative;z-index:2;max-width:1080px;margin:0 auto;padding:14px 14px 40px}

.brand{text-align:center;padding:14px 6px 4px}
.brand h1{font-size:clamp(1.7rem,6vw,3rem);letter-spacing:4px;font-weight:800;
  background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(0,240,255,.5))}
.brand .sub{color:#8ea2d6;font-size:.84rem;letter-spacing:2px;margin-top:4px;text-transform:uppercase}

.hud{position:sticky;top:0;z-index:50;margin:10px 0 16px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px;
  align-items:center;justify-content:space-between;background:linear-gradient(180deg,rgba(12,8,34,.95),rgba(12,8,34,.75));
  border:1px solid var(--stroke);border-radius:16px;backdrop-filter:blur(10px);
  box-shadow:0 0 26px rgba(0,240,255,.12),inset 0 0 26px rgba(168,85,247,.07)}
.hud .grp{display:flex;align-items:center;gap:8px}
.tag{font-size:.66rem;letter-spacing:1.5px;color:#8ea2d6;text-transform:uppercase;
  border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:3px 8px}
.hearts{font-size:1.3rem;letter-spacing:3px;line-height:1}
.hearts .off{opacity:.22;filter:grayscale(1)}
.hearts .pop{animation:hp .5s}
@keyframes hp{0%{transform:scale(1)}40%{transform:scale(1.7)}100%{transform:scale(1)}}
.score{font-size:1.25rem;font-weight:800;color:var(--cyan);text-shadow:0 0 12px var(--cyan)}
.score.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.3)}}
.prog{display:flex;gap:6px}
.pip{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:.8rem;font-weight:700;
  border:1px solid rgba(255,255,255,.15);color:#5d6da3;background:rgba(255,255,255,.03);transition:.35s}
.pip.done{background:linear-gradient(145deg,var(--green),#0f9b6a);border-color:var(--green);color:#04241a;box-shadow:0 0 14px rgba(37,244,167,.6)}
.pip.cur{background:linear-gradient(145deg,var(--cyan),var(--blue));border-color:var(--cyan);color:#04121f;box-shadow:0 0 16px rgba(0,240,255,.7);transform:scale(1.1)}
.hud .ph-name{font-weight:700;font-size:.88rem;color:var(--purple);text-shadow:0 0 10px rgba(168,85,247,.6)}

.panel{background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.015));
  border:1px solid rgba(255,255,255,.11);border-radius:20px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.45);animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
h2.ptitle{font-size:1.15rem;letter-spacing:1px;display:flex;align-items:center;gap:9px;margin-bottom:6px;color:#fff;flex-wrap:wrap}
h2.ptitle span.badge{background:linear-gradient(90deg,var(--cyan),var(--purple));color:#04121f;font-size:.7rem;padding:3px 9px;border-radius:20px;font-weight:800;letter-spacing:1px}
.muted{color:#93a3d4;font-size:.87rem;line-height:1.55}
.center{text-align:center}
.hide{display:none !important}

.btn{position:relative;border:1px solid var(--stroke);color:var(--txt);cursor:pointer;
  background:linear-gradient(145deg,rgba(0,240,255,.14),rgba(168,85,247,.14));padding:11px 20px;border-radius:13px;
  font-weight:700;font-size:.92rem;letter-spacing:.6px;transition:.22s;font-family:inherit}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 22px rgba(0,240,255,.4);border-color:var(--cyan)}
.btn:active{transform:translateY(0) scale(.98)}
.btn:disabled{opacity:.34;cursor:not-allowed;transform:none;box-shadow:none;filter:grayscale(1)}
.btn.big{font-size:1.05rem;padding:15px 32px}
.btn.primary{background:linear-gradient(145deg,var(--cyan),var(--blue));color:#02121e;border-color:transparent}
.btn.ok{background:linear-gradient(145deg,var(--green),#0f9b6a);color:#04241a;border-color:transparent}
.btn.danger{background:linear-gradient(145deg,var(--red),#a01030);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 13px;font-size:.78rem}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}

#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,140%);z-index:900;padding:13px 22px;border-radius:14px;
  font-weight:700;max-width:92vw;text-align:center;background:rgba(10,6,32,.96);border:1px solid var(--cyan);
  box-shadow:0 0 30px rgba(0,240,255,.35);transition:transform .35s cubic-bezier(.2,1.3,.4,1);font-size:.9rem}
#toast.show{transform:translate(-50%,0)}
#toast.good{border-color:var(--green);box-shadow:0 0 30px rgba(37,244,167,.45)}
#toast.bad{border-color:var(--red);box-shadow:0 0 30px rgba(255,59,92,.45)}
#toast.warn{border-color:var(--yellow);box-shadow:0 0 30px rgba(127, 201, 8, 0.45)}

.modal{position:fixed;inset:0;z-index:800;display:grid;place-items:center;padding:18px;overflow-y:auto;
  background:rgba(3,1,12,.87);backdrop-filter:blur(6px);animation:fade .3s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal .box{max-width:560px;width:100%;text-align:center;padding:26px 22px;
  background:linear-gradient(160deg,#150c38,#080420);border:1px solid var(--purple);border-radius:22px;
  box-shadow:0 0 60px rgba(168,85,247,.35);animation:pop .4s cubic-bezier(.2,1.4,.4,1) both;margin:auto}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.modal .big-emo{font-size:3.2rem;animation:float 2.4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

.hero{text-align:center;padding:32px 18px;border-radius:24px;
  background:linear-gradient(160deg,rgba(168,85,247,.16),rgba(0,240,255,.08));
  border:1px solid rgba(168,85,247,.35);box-shadow:0 0 46px rgba(168,85,247,.2)}
.hero .lock{font-size:4.4rem;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 0 22px var(--cyan))}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:18px}
.mcard{text-align:left;padding:14px;border-radius:15px;background:var(--glass);border:1px solid rgba(255,255,255,.1);transition:.25s}
.mcard:hover{border-color:var(--cyan);transform:translateY(-3px);background:rgba(0,240,255,.07)}
.mcard .n{font-size:1.6rem}
.mcard b{display:block;font-size:.92rem;margin:5px 0 3px;color:#fff}
.mcard small{color:#8ea2d6;font-size:.75rem;line-height:1.4;display:block}

/* barra de tempo */
.timebar{height:9px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;margin:12px 0 4px;border:1px solid rgba(255,255,255,.1)}
.timebar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));transition:width .18s linear}
.timebar.low i{background:linear-gradient(90deg,var(--red),var(--pink))}
.timebar.low{animation:blink .7s infinite}
@keyframes blink{50%{border-color:var(--red)}}

/* FASE 1 */
.mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.mem-animal{aspect-ratio:1/1;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.12);
  cursor:pointer;transition:.2s;user-select:none;position:relative}
.mem-animal .e{font-size:clamp(1.7rem,7vw,2.7rem);filter:drop-shadow(0 0 12px rgba(0,240,255,.5))}
.mem-animal .l{font-size:.62rem;letter-spacing:1px;color:#8ea2d6}
.mem-animal:hover:not(.locked){border-color:var(--cyan);transform:translateY(-3px);box-shadow:0 0 20px rgba(0,240,255,.3)}
.mem-animal.picked{border-color:var(--purple);background:linear-gradient(160deg,rgba(168,85,247,.28),rgba(168,85,247,.05));box-shadow:0 0 18px rgba(168,85,247,.45)}
.mem-animal.picked::after{content:'✓';position:absolute;top:4px;right:7px;color:var(--green);font-weight:800;font-size:.9rem}
.mem-animal.locked{opacity:.45;cursor:not-allowed}
.mem-animal.press{animation:press .25s}
@keyframes press{50%{transform:scale(.9)}}
.seq-box{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0;min-height:74px;align-items:center}
.seq-slot{width:60px;border-radius:14px;display:grid;place-items:center;border:2px dashed rgba(255,255,255,.18);
  transition:.2s;height:64px;position:relative}
.seq-slot .se{font-size:1.9rem}
.seq-slot .sn{position:absolute;bottom:-2px;font-size:.5rem;letter-spacing:.5px;color:#7f8fbf}
.seq-slot.on{border-style:solid;background:linear-gradient(160deg,rgba(0,240,255,.18),rgba(168,85,247,.1));box-shadow:0 0 18px rgba(0,240,255,.4);animation:pop .35s}
.seq-slot.hit{border-color:var(--green);background:rgba(37,244,167,.16);box-shadow:0 0 20px rgba(37,244,167,.5)}
.seq-slot.miss{border-color:var(--red);background:rgba(255,59,92,.16);animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.rounds{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
.rd{width:34px;height:6px;border-radius:6px;background:rgba(255,255,255,.12)}
.rd.on{background:linear-gradient(90deg,var(--cyan),var(--purple));box-shadow:0 0 10px var(--cyan)}
.streak{text-align:center;font-weight:800;letter-spacing:1px;color:var(--pink);font-size:.82rem;margin-top:8px}

/* FASE 2 */
.avatar-stage{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
#avatarBox{width:190px;height:246px;border-radius:20px;position:relative;flex:0 0 auto;
  background:linear-gradient(180deg,rgba(0,240,255,.09),rgba(168,85,247,.12));
  border:2px solid rgba(0,240,255,.35);box-shadow:0 0 30px rgba(0,240,255,.2),inset 0 0 30px rgba(168,85,247,.12)}
#avatarBox.shake{animation:shake .4s}
.slot{position:absolute;display:grid;place-items:center;border-radius:12px;transition:.2s;border:1px dashed transparent}
.slot .ph{font-size:1.8rem;opacity:.28}
.slot.filled .ph{display:none}
.slot.filled{border-color:rgba(0,240,255,.5);background:rgba(0,240,255,.07)}
.slot .it{font-size:2rem;filter:drop-shadow(0 0 10px rgba(0,240,255,.6))}
#s-cabelo{top:8px;left:0;right:0;height:52px}
#s-olhos{top:64px;left:0;right:0;height:42px}
#s-boca{top:108px;left:0;right:0;height:42px}
#s-corpo{bottom:8px;left:12px;right:12px;height:78px}
#profilePanel{flex:1 1 270px;min-width:250px;border-radius:18px;padding:16px;min-height:190px;
  border:2px dashed rgba(168,85,247,.4);background:rgba(168,85,247,.06);transition:.2s}
#profilePanel.over{border-color:var(--green);background:rgba(37,244,167,.14);box-shadow:0 0 24px rgba(37,244,167,.35)}
.tray{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}
.piece,.card,.news{cursor:grab;user-select:none;transition:.2s;touch-action:none;border-radius:13px;
  background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.14);padding:9px 12px;font-size:.85rem;font-weight:600}
.piece:hover,.card:hover,.news:hover{border-color:var(--cyan);transform:translateY(-2px);box-shadow:0 0 16px rgba(0,240,255,.28)}
.piece .e,.card .e{font-size:1.4rem;margin-right:6px}
.piece.used,.card.used{opacity:.26;pointer-events:none;filter:grayscale(1)}
.card.safe{border-color:rgba(37,244,167,.5);background:linear-gradient(160deg,rgba(37,244,167,.14),transparent)}
.card.bad{border-color:rgba(255,59,92,.5);background:linear-gradient(160deg,rgba(255,59,92,.14),transparent)}
.card.bad:hover{border-color:var(--red);box-shadow:0 0 16px rgba(255,59,92,.4)}
#ghost{position:fixed;z-index:1000;pointer-events:none;font-size:.8rem;font-weight:700;padding:9px 13px;border-radius:12px;
  background:rgba(0,240,255,.22);border:1px solid var(--cyan);box-shadow:0 0 22px rgba(0,240,255,.5);transform:translate(-50%,-50%) scale(1.05)}
.prot-list{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.prot{display:flex;gap:8px;align-items:center;background:rgba(37,244,167,.1);border:1px solid rgba(37,244,167,.3);
  border-radius:10px;padding:7px 11px;font-size:.8rem;animation:rise .3s both}
.prot .k{color:var(--green);font-weight:800}
.alert-box{margin-top:12px;padding:11px 13px;border-radius:12px;border:1px solid var(--red);
  background:rgba(255,59,92,.14);color:#ffc7d2;font-size:.82rem;font-weight:600;animation:shake .45s;text-align:left}
.checks{margin-top:10px;display:flex;flex-direction:column;gap:5px}
.chk{display:flex;gap:8px;align-items:center;font-size:.78rem;padding:6px 10px;border-radius:9px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
.chk.ok{color:var(--green);border-color:rgba(37,244,167,.3);background:rgba(37,244,167,.08)}
.chk.no{color:#7f8fbf}
.audit{display:flex;flex-direction:column;gap:7px;margin-top:14px;text-align:left}
.arow{display:flex;gap:10px;align-items:center;padding:10px 13px;border-radius:12px;
  background:rgba(37,244,167,.09);border:1px solid rgba(37,244,167,.3);font-size:.84rem;opacity:0;animation:rise .4s both}
.scorebig{font-size:1.5rem;font-weight:800;color:var(--green);text-shadow:0 0 14px var(--green)}

/* ---- FASE 2 SIMPLIFICADA ---- */
.objetivo{
  margin:10px 0 12px;padding:11px 13px;border-radius:12px;
  background:linear-gradient(90deg,#fff8d0,#fffdf2);border:2px solid #b8860b;font-size:.83rem;line-height:1.55
}
.objetivo b{color:#8a5a00}
.objetivo .odica{margin-top:6px;font-size:.76rem;color:#6b4f14;opacity:.9}
.screen .objetivo{background:#fff8d0;border-color:#b8860b;color:#3b2a00}
.screen .objetivo .odica{color:#6b4f14}

/* peça selecionável por clique */
.piece.sel{outline:3px solid #1f5fa8;outline-offset:1px;background:#dfe8f5 !important}
.slot.alvo{outline:3px dashed #2e7d3c;outline-offset:-3px;background:#dff5e4 !important;border-style:dashed !important}
.screen .slot.alvo{background:#dff5e4 !important;outline-color:#2e7d3c}

/* painel de proteção */
.protect{
  border:3px dashed #2e7d3c;background:#f2fbf4;border-radius:12px;padding:14px;min-height:96px;
  margin-bottom:12px;transition:.2s
}
.protect.over{background:#dff5e4;border-style:solid;box-shadow:0 0 18px rgba(46,125,60,.35)}
.screen .protect{background:#f2fbf4;border-color:#2e7d3c}
.protect .plog{font-size:.82rem;color:#0a3a18;margin-bottom:8px}
.prot-list{display:flex;flex-direction:column;gap:6px;min-height:20px}
.prot{border-radius:9px;padding:7px 11px;font-size:.82rem;display:flex;gap:8px;align-items:center;
  background:#dff5e4;border:1px solid #2e7d3c;color:#0a3a18;animation:rise .3s both}
.prot b{color:#0a4a0a}
.prot.bad{background:#ffe0e0;border-color:#a01818;color:#6b0000}
.prot.bad b{color:#a01818}
.screen .prot{background:#dff5e4;border:1px solid #2e7d3c;color:#0a3a18}
.screen .prot.bad{background:#ffe0e0;border-color:#a01818;color:#6b0000}
.prot-list:empty::after{content:"nenhuma proteção ainda — clique nas opções verdes abaixo";
  font-size:.78rem;color:#7a8a7a;font-style:italic}

/* texto explicativo dentro de cada opção */
.card .why{display:block;font-size:.7rem;color:#444;margin-top:4px;line-height:1.4;font-weight:400}
.screen .card .why{color:#333}
.card.safe .why{color:#0a4a0a}
.card.bad .why{color:#6b0000}

/* teclado da senha mais claro */
.keypad .key{line-height:1.35;min-width:88px}
.keypad .key b{font-size:.95rem;display:block}
.screen .keypad .key{background:linear-gradient(180deg,#e8e8e8,#b0b0b0);border:2px outset #efefef;color:#000;box-shadow:1px 1px 0 #000}

/* =====================================================================
   LEGIBILIDADE — FASE 3 (phishing) e FASE 4 (fake news)
   ===================================================================== */
.progress-dots{display:flex;gap:7px;justify-content:center;margin:10px 0}
.pdot{width:14px;height:14px;border-radius:50%;border:2px solid var(--graysh);background:var(--graylt)}
.pdot.on{background:#2e7d3c;border-color:#1c5426}
.pdot.cur{background:#1f5fa8;border-color:#0d3c6b;transform:scale(1.25)}

/* FASE 3 */
.mail-hd{display:flex;flex-direction:column;gap:4px;padding:14px 16px;background:#dbe4f2;border-bottom:2px solid #8ea2bd}
.mail-hd .row{display:flex;gap:10px;font-size:.88rem;align-items:flex-start;line-height:1.5}
.mail-hd .lbl{flex:0 0 74px;font-weight:700;color:#243a5e;font-size:.76rem;letter-spacing:.5px;padding-top:2px}
.mail-hd .val{flex:1;color:#000;word-break:break-all;font-weight:600}
.mail-hd .dom{background:#f8c9c9;padding:2px 6px;border-radius:5px;border:2px solid #9c1010;color:#6e0000;font-weight:700}
.mail-hd .subj{font-size:1.02rem;font-weight:800;color:#7a0000;line-height:1.45}
.mail-bd{padding:18px 16px;font-size:1.02rem;line-height:2.1;color:#000;background:#fff}

/* sinal suspeito: agora em VERMELHO */
.sign{
  display:inline-block;padding:4px 9px;margin:2px 0;border-radius:6px;cursor:pointer;transition:.16s;
  border:2px dashed #9c1010;background:#f8c9c9;color:#6e0000;font-weight:700;line-height:1.5
}
.sign:hover{background:#ffb3b3;box-shadow:0 0 0 3px rgba(255,120,120,.45)}
.sign:active{transform:scale(.97)}
/* sinal já encontrado: verde ESCURO com texto branco */
.sign.found{background:#1f6b32;border:2px solid #0d3a1b;color:#eafff0;box-shadow:none}
.sign.found::after{content:' ✓';font-weight:900}
.sign.flash{animation:flash .7s}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(31,95,168,.6)}40%{box-shadow:0 0 0 8px rgba(31,95,168,0)}}

.huntlist{display:flex;flex-direction:column;gap:8px;margin-top:12px;
  border:2px outset #efefef;background:var(--gray);border-radius:0;padding:12px}
.hunt-hd{font-size:.76rem;font-weight:800;letter-spacing:1px;color:#000080;
  border-bottom:1px solid var(--graysh);padding-bottom:6px;margin-bottom:2px}
.hunt{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;cursor:pointer;
  background:var(--graylt);border:1px solid var(--graysh);font-size:.88rem;transition:.18s;text-align:left;width:100%}
.hunt:hover{background:#dfe8f5;border-color:#1f5fa8}
.hunt .box{width:22px;height:22px;border-radius:5px;border:2px inset #efefef;background:#fff;
  display:grid;place-items:center;font-size:.8rem;flex:0 0 auto;color:transparent}
.hunt.done{background:#1f6b32;border-color:#0d3a1b;color:#eafff0}
.hunt.done .box{background:#eafff0;border:2px outset #a8e6bb;color:#0d3a1b}
.hunt.done .txt{text-decoration:line-through;opacity:.9}
.hunt .txt{flex:1}
.hunt .tag-s{font-size:.66rem;letter-spacing:1px;padding:2px 7px;border-radius:9px;
  background:#f8c9c9;border:1px solid #9c1010;color:#6e0000;font-weight:800}

.debrief{display:flex;flex-direction:column;gap:8px;margin-top:14px;text-align:left}
.debrief .dh{font-size:.74rem;font-weight:800;letter-spacing:1px;color:#119933;margin-top:4px}
.dline{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border-radius:9px;
  background:var(--graylt);border:1px solid var(--graysh);font-size:.86rem;line-height:1.5}
.dline b{display:block;font-size:.88rem;margin-bottom:2px}
.dline .dsc{color:#3c4553;font-size:.8rem;line-height:1.5}
.dline.hit{background:#1f6b32;border-color:#0d3a1b;color:#eafff0}
.dline.hit .dsc{color:#cfe8d8}
.dline.missed{background:#f8c9c9;border:2px solid #9c1010;color:#6e0000}
.dline.missed .dsc{color:#7a2020}

/* FASE 4 */
.pbar{display:flex;align-items:center;gap:10px;margin:10px 0}
.pbar .pl{flex:0 0 auto;font-size:.76rem;font-weight:700;color:#243a5e;letter-spacing:.5px}
.pbar .pt{flex:1;height:20px;border:2px inset #efefef;background:#fff;padding:2px}
.pbar .pt i{display:block;height:100%;background:linear-gradient(90deg,#2e7d3c,#7fc98a);width:0;transition:width .35s}
.pbar .pn{flex:0 0 auto;font-weight:800;color:#2e7d3c;font-size:.86rem}

.ncard{border:2px outset #efefef;background:var(--graylt);border-left:6px solid #1f5fa8;
  border-radius:0;padding:13px 14px;line-height:1.55;color:#000}
.ncard .meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:7px}
.ncard .meta span{font-size:.7rem;letter-spacing:.4px;padding:3px 8px;border-radius:10px;
  background:#fff;border:1px solid var(--graysh);color:#333}
.ncard .meta .fonte{font-weight:800;color:#1f5fa8;background:#dbe4f2}
.ncard .titulo{font-size:1.06rem;font-weight:800;color:#000;line-height:1.4;margin-bottom:6px}
.ncard .desc{font-size:.86rem;color:#3c4553;line-height:1.55}
.ncard .acts{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap;align-items:center}
.ncard.sel{border-color:#1f5fa8;background:#dfe8f5;box-shadow:0 0 0 3px rgba(31,95,168,.35)}
.ncard.ok{border-left-color:#2e7d3c;background:#c8e6c8;opacity:.85;pointer-events:none}
.ncard.ok .titulo{text-decoration:line-through}
.ncard.err{border-left-color:#a01818;background:#ffd6d6;animation:shake .45s}
.ncard.done{pointer-events:none}

.clues{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:11px}
.clue{padding:9px 11px;border-radius:8px;background:#fff;border:1px solid var(--graysh);font-size:.8rem;line-height:1.45}
.clue b{display:block;font-size:.66rem;letter-spacing:1px;color:#5a6473;margin-bottom:3px;text-transform:uppercase}
.clue.good{background:#dff5e4;border-color:#2e7d3c}
.clue.good b{color:#2e7d3c}
.clue.bad{background:#ffe4e4;border-color:#a01818}
.clue.bad b{color:#a01818}
.clue .mk{font-weight:800;margin-right:4px}

.trashbox{border:3px dashed #b8860b;background:#fff6d0;border-radius:0;padding:16px 12px;text-align:center;
  min-height:130px;display:grid;place-items:center;transition:.2s}
.trashbox .t{font-size:2.6rem;line-height:1}
.trashbox .lb{font-size:.8rem;font-weight:800;color:#8a5a00;letter-spacing:1px;margin-top:4px}
.trashbox .sb{font-size:.74rem;color:#6b4f14;margin-top:4px;line-height:1.45}
.trashbox.hot{border-style:solid;border-color:#a01818;background:#ffe0e0}
.trashbox.ready{border-color:#2e7d3c;background:#dff5e4}

/* =====================================================================
   MAPA DE MISSÕES (troca de fase livre)
   ===================================================================== */
.mapbtn{
  font-size:.7rem;letter-spacing:.5px;font-weight:700;padding:4px 10px;cursor:pointer;
  background:linear-gradient(145deg,rgba(0,240,255,.16),rgba(168,85,247,.16));
  border:1px solid var(--stroke);color:var(--txt);border-radius:8px;font-family:inherit;transition:.18s
}
.mapbtn:hover{background:rgba(0,240,255,.28);box-shadow:0 0 12px rgba(0,240,255,.4)}
.screen .mapbtn{background:linear-gradient(180deg,#e8e8e8,#b0b0b0);border:2px outset #efefef;
  color:#000;box-shadow:1px 1px 0 #000;border-radius:0;padding:4px 11px;font-size:.72rem}
.screen .mapbtn:active{border-style:inset;box-shadow:none}

.maplist{display:flex;flex-direction:column;gap:8px;margin-top:12px;text-align:left}
.maprow{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  padding:11px 13px;border-radius:10px;border:2px outset #efefef;background:var(--graylt);
  font-family:inherit;font-size:.9rem;color:#000;transition:.18s
}
.maprow:hover{background:#dfe8f5;transform:translateX(3px)}
.maprow .mi{font-size:1.5rem;flex:0 0 auto;line-height:1}
.maprow .mt{flex:1;display:flex;flex-direction:column;line-height:1.35}
.maprow .mt b{font-size:.92rem}
.maprow .mt small{font-size:.74rem;color:#4a5261;margin-top:2px}
.maprow .ms{font-size:.74rem;font-weight:800;color:#2e7d3c;flex:0 0 auto;letter-spacing:.5px}
.maprow.done{background:#dff5e4;border-color:#2e7d3c}
.maprow.cur{background:#dbe4f2;border-color:#1f5fa8;box-shadow:0 0 0 3px rgba(31,95,168,.3)}
.maprow.cur .ms{color:#1f5fa8}

/* ---- Lição educativa ao final de cada fase ---- */
.lesson{
  margin:14px 0 4px;border-radius:16px;padding:14px;text-align:left;
  background:linear-gradient(150deg,rgba(0,240,255,.12),rgba(168,85,247,.12));
  border:1px solid rgba(0,240,255,.35);box-shadow:0 0 24px rgba(0,240,255,.12)
}
.lesson .lk{font-size:.6rem;letter-spacing:2px;color:var(--cyan);font-weight:800;margin-bottom:6px}
.lesson .lt{font-size:.95rem;font-weight:800;color:#fff;line-height:1.35;margin-bottom:6px}
.lesson .lp{font-size:.82rem;color:#c3d0f5;line-height:1.6}
.lesson .la{
  margin-top:9px;padding:9px 11px;border-radius:11px;font-size:.8rem;line-height:1.55;
  background:rgba(37,244,167,.1);border:1px solid rgba(37,244,167,.3);color:#c8ffe9;text-align:left
}
.lesson .la b{color:var(--green)}
.lesson .statline{display:flex;gap:10px;flex-wrap:wrap;margin-top:9px}
.lesson .st{flex:1 1 90px;text-align:center;padding:7px;border-radius:10px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.1)}
.lesson .st b{display:block;font-size:1rem;color:var(--yellow)}
.lesson .st span{font-size:.62rem;letter-spacing:1px;color:#8ea2d6;text-transform:uppercase}

/* ---- FASE 1: modo reverso / embaralhado ---- */
.modes{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:8px 0 2px}
.mode{font-size:.66rem;letter-spacing:1.2px;font-weight:800;padding:5px 10px;border-radius:20px;
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:#6f80b3}
.mode.on{border-color:var(--pink);color:var(--pink);background:rgba(255,62,165,.16);box-shadow:0 0 12px rgba(255,62,165,.35)}
.slot.matched{box-shadow:0 0 0 2px rgba(37,244,167,.5), 0 0 18px rgba(37,244,167,.35)}

/* ---- FASE 2: nome do agente ---- */
.namebox{margin-top:14px;border-radius:14px;border:1px solid rgba(168,85,247,.4);background:rgba(168,85,247,.07);padding:12px}
.namebox input{
  width:100%;max-width:320px;margin:8px auto 0;display:block;border-radius:11px;padding:10px 13px;font-size:1rem;
  border:1px solid rgba(0,240,255,.4);background:rgba(0,0,0,.4);color:var(--txt);text-align:center;
  font-family:inherit;letter-spacing:.5px
}
.namebox input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 16px rgba(0,240,255,.35)}
.namebox .verdict{margin-top:8px;font-size:.78rem;font-weight:700;min-height:20px}
.namebox .verdict.ok{color:var(--green)}
.namebox .verdict.bad{color:var(--red)}
.themes{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.theme{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.2);cursor:pointer;transition:.2s}
.theme.on{border-color:#fff;transform:scale(1.18);box-shadow:0 0 16px currentColor}
.avname{position:absolute;left:0;right:0;bottom:-2px;text-align:center;font-size:.62rem;letter-spacing:1px;color:var(--cyan)}

/* ---- FASE 2: entropia e senhas comuns ---- */
.bitsrow{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:9px}
.bit{font-size:.7rem;padding:5px 10px;border-radius:10px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);color:#9fb0dd}
.bit b{color:var(--cyan)}
.cmp{margin-top:11px;border-radius:12px;border:1px solid rgba(255,59,92,.35);background:rgba(255,59,92,.09);padding:10px 12px;text-align:left}
.cmp .crow{display:flex;justify-content:space-between;gap:10px;font-size:.76rem;padding:3px 0;color:#ffc2cd}
.cmp .crow b{color:#ff8095}
.weakwarn{margin-top:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--red);
  background:rgba(255,59,92,.16);color:#ffc7d2;font-size:.8rem;font-weight:700;animation:shake .4s}

/* ---- FASE 2: 2FA ---- */
.otpbox{margin-top:13px;border-radius:14px;border:1px solid rgba(37,244,167,.4);background:rgba(37,244,167,.07);padding:13px;text-align:center}
.otpcode{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.5rem;letter-spacing:9px;color:var(--green);
  text-shadow:0 0 14px rgba(37,244,167,.6);margin:6px 0 10px}
.otpcode span{display:inline-block;animation:pop .3s both}
.otpinput{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.3rem;letter-spacing:8px;text-align:center;
  width:190px;padding:9px;border-radius:11px;border:1px solid rgba(37,244,167,.5);background:rgba(0,0,0,.4);color:var(--txt)}
.otpinput:focus{outline:none;box-shadow:0 0 16px rgba(37,244,167,.35)}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.step{
  flex:1 1 150px;font-size:.76rem;font-weight:700;padding:8px 10px;border-radius:11px;
  border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#7f8fbf;transition:.3s
}
.step.cur{border-color:var(--cyan);color:var(--cyan);background:rgba(0,240,255,.1);box-shadow:0 0 14px rgba(0,240,255,.3)}
.step.done{border-color:var(--green);color:var(--green);background:rgba(37,244,167,.1)}

/* ---- FASE 2: construtor de senha + hacker ---- */
.pwbox{border-radius:16px;border:1px solid rgba(0,240,255,.3);background:rgba(0,0,0,.28);padding:14px}
.pwfield{
  min-height:48px;border-radius:12px;border:1px dashed rgba(0,240,255,.4);background:rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center;gap:2px;flex-wrap:wrap;padding:8px 10px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.3rem;letter-spacing:3px;color:var(--cyan);min-height:52px
}
.pwfield.empty{color:#5d6da3;letter-spacing:1px;font-size:.85rem;font-family:inherit}
.pwfield.ok{border-style:solid;border-color:var(--green);color:var(--green);box-shadow:0 0 18px rgba(37,244,167,.35)}
.pwfield.hacked{border-color:var(--red);color:var(--red);animation:shake .4s}
.pwbar{height:12px;border-radius:10px;background:rgba(255,255,255,.08);overflow:hidden;border:1px solid rgba(255,255,255,.12);margin:10px 0 4px}
.pwbar i{display:block;height:100%;width:0;transition:width .3s,background .3s}
.pwlabel{font-weight:800;letter-spacing:1px;font-size:.82rem;text-align:center}
.reqs{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:6px;margin-top:10px}
.req{font-size:.72rem;padding:6px 9px;border-radius:9px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#8ea2d6;transition:.25s}
.req.ok{border-color:rgba(37,244,167,.5);background:rgba(37,244,167,.1);color:#a8ffdd}
.keypad{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.key{
  border:1px solid rgba(0,240,255,.35);background:rgba(0,240,255,.08);color:var(--txt);cursor:pointer;
  border-radius:12px;padding:10px 14px;font-weight:700;font-size:.84rem;transition:.18s;font-family:inherit
}
.key:hover{background:rgba(0,240,255,.24);box-shadow:0 0 14px rgba(0,240,255,.35);transform:translateY(-2px)}
.key:active{transform:scale(.95)}
.key.del{border-color:rgba(255,217,61,.5);background:rgba(255,217,61,.1)}
.hacker{
  margin-top:14px;border-radius:16px;border:1px solid rgba(255,59,92,.4);background:rgba(255,59,92,.08);padding:13px
}
.hacker .hrow{display:flex;align-items:center;gap:10px;font-size:.82rem;margin-bottom:7px}
.hackbar{height:11px;border-radius:9px;background:rgba(0,0,0,.4);overflow:hidden;border:1px solid rgba(255,59,92,.35)}
.hackbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--yellow),var(--red));transition:width .25s linear}
.hackbar.hot i{background:linear-gradient(90deg,var(--red),#ff0000)}
.battleline{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:11px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);font-size:.8rem;animation:rise .35s both}
.battleline b{color:var(--cyan)}

/* ---- FASE 5: barras de vida, chefe e power-ups ---- */
.hpbar{width:130px;height:12px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden;border:1px solid rgba(255,255,255,.18)}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));transition:width .25s}
.hpbar.low i{background:linear-gradient(90deg,var(--red),var(--pink))}
.gauge{width:88px;height:9px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden;border:1px solid rgba(255,255,255,.16)}
.gauge i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--pink));transition:width .12s linear}
.gauge.ready i{background:linear-gradient(90deg,var(--cyan),#fff)}
.gauge.empty i{width:0 !important}
.pwslots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.pwslot{
  font-size:.68rem;padding:3px 9px;border-radius:20px;border:1px solid rgba(0,240,255,.4);
  background:rgba(0,240,255,.12);color:var(--cyan);font-weight:700;letter-spacing:.5px;animation:pop .3s both
}
.bossbar{
  position:absolute;left:12px;right:12px;top:38px;z-index:5;pointer-events:none;
  opacity:0;transition:opacity .4s
}
.bossbar.on{opacity:1}
.bossbar .bt{font-size:.62rem;letter-spacing:2px;color:#ffb4c0;text-align:center;margin-bottom:3px;font-weight:800}
.bossbar .bb{height:11px;border-radius:8px;background:rgba(0,0,0,.6);border:1px solid var(--red);overflow:hidden}
.bossbar .bb i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--pink));transition:width .18s}
.boss-emo{position:absolute;left:0;right:0;top:64px;text-align:center;font-size:2.6rem;pointer-events:none;filter:drop-shadow(0 0 16px var(--red))}
.hpdots{display:inline-flex;gap:4px}
.hpdot{width:13px;height:13px;border-radius:4px;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.hpdot.off{background:rgba(255,255,255,.14);box-shadow:none}
.cflash{animation:cf .3s}
@keyframes cf{50%{filter:brightness(2.2)}}

/* =====================================================================
   RETRO: VISUAL DE COMPUTADOR ANTIGO (CRT bege + Windows 95)
   Tudo abaixo sobrescreve o tema neon mantendo o conteúdo dentro da tela.
   ===================================================================== */
:root{
  --case1:#e9e2cc; --case2:#cfc4a2; --case3:#b3a684;
  --gray:#c0c0c0; --graylt:#dfdfdf; --graysh:#808080; --graydk:#3b3b3b;
  --navy:#000080; --navy2:#1084d0;
  --amber:#ffb000; --phos:#4bff9b;
}
*{font-family:'MS Sans Serif','Segoe UI',Tahoma,Verdana,sans-serif}

body{
  background:
    radial-gradient(ellipse at 50% 0%, #2a2f38 0%, #14161b 45%, #08090b 100%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px 10px;
}
body::before{display:none}          /* remove a grade neon */
body::after{display:none}

/* ---------- gabinete / monitor ---------- */
.room{position:relative;z-index:2;width:100%;display:flex;flex-direction:column;align-items:center;gap:0}
.monitor{
  width:min(1120px,98vw);
  border-radius:26px 26px 20px 20px;
  background:linear-gradient(180deg,var(--case1),var(--case2) 45%,var(--case3));
  padding:16px 16px 0;
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.7),
    inset 0 -3px 6px rgba(0,0,0,.35),
    0 26px 60px rgba(0,0,0,.75),
    0 0 0 1px rgba(0,0,0,.25);
  position:relative;
}
.monitor .screw{position:absolute;width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle,#b9ae8c,#7d7458);box-shadow:inset 0 1px 1px rgba(0,0,0,.5)}
.screw.a{top:8px;left:9px} .screw.b{top:8px;right:9px} .screw.c{bottom:12px;left:9px} .screw.d{bottom:12px;right:9px}

/* ---------- tela CRT ---------- */
.screenwrap{
  background:#15140f;border-radius:14px;padding:12px;
  box-shadow:inset 0 0 0 2px #4a4636, inset 0 6px 18px rgba(0,0,0,.9);
  position:relative;
}
.screen{
  position:relative;width:100%;height:min(78vh,900px);overflow:auto;overflow-x:hidden;
  background:#0d1b0d;border-radius:6px;color:#d8ffe4;
  font-family:'Courier New',Courier,monospace;
  scrollbar-width:thin;
}
.screen::-webkit-scrollbar{width:14px}
.screen::-webkit-scrollbar-track{background:var(--graylt)}
.screen::-webkit-scrollbar-thumb{background:var(--navy2);border:2px solid var(--graylt)}

/* efeitos de tubo (scanlines/vinheta/cintilação) removidos: cobriam o jogo */

/* ---------- detalhe inferior do gabinete ---------- */
.deck{
  display:flex;align-items:center;gap:14px;padding:11px 6px 13px;flex-wrap:wrap
}
.deck .mbrand{font-weight:800;letter-spacing:2px;color:#5c5340;font-size:.82rem;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.deck .mbrand small{display:block;font-weight:600;letter-spacing:1px;font-size:.58rem;color:#7d7460}
.deck .vents{flex:1;height:12px;border-radius:3px;
  background:repeating-linear-gradient(90deg,#8f8769 0 3px,transparent 3px 9px);min-width:70px}
.knob{width:22px;height:22px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#f3ecd6,#a89f80);box-shadow:0 2px 3px rgba(0,0,0,.45),inset 0 -2px 3px rgba(0,0,0,.3)}
.led{width:11px;height:11px;border-radius:50%;background:var(--phos);box-shadow:0 0 12px var(--phos),0 0 3px #fff;animation:ledb 3.4s infinite}
@keyframes ledb{0%,92%,100%{opacity:1}94%{opacity:.35}96%{opacity:.8}}
.pwrbtn{
  width:38px;height:26px;border-radius:6px;cursor:pointer;border:1px solid #9a9174;
  background:linear-gradient(180deg,#f0e9d2,#c6bb98);box-shadow:0 2px 4px rgba(0,0,0,.4);
  display:grid;place-items:center;font-size:.9rem;color:#4a4334
}
.pwrbtn:active{transform:translateY(1px)}
.stand{width:190px;height:26px;border-radius:0 0 14px 14px;
  background:linear-gradient(180deg,var(--case2),var(--case3));box-shadow:0 14px 26px rgba(0,0,0,.6)}
.standbase{width:290px;height:14px;border-radius:50%;
  background:linear-gradient(180deg,#4b4636,#2a271d);box-shadow:0 18px 30px rgba(0,0,0,.7)}

/* ---------- BOOT / POST ---------- */
.boot{min-height:100%;padding:18px 16px;font-size:14px;line-height:1.6;white-space:pre-wrap;color:var(--phos)}
.boot .amber{color:var(--amber)}
.boot .dim{color:#3f8f5f}
.boot .ok{color:#9dffb8}
.boot .cursor{display:inline-block;width:9px;height:16px;background:var(--phos);vertical-align:-3px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.bootbar{margin-top:10px;height:16px;border:1px solid var(--phos);padding:2px;background:rgba(0,0,0,.5)}
.bootbar i{display:block;height:100%;background:var(--phos);width:0;transition:width .12s linear}

/* ---------- LOGIN ---------- */
.login{min-height:100%;display:grid;place-items:center;padding:22px;text-align:center}
.loginbox{width:min(430px,100%)}
.loginbox .sysname{font-size:1.15rem;letter-spacing:3px;color:var(--phos);font-weight:800;
  text-shadow:0 0 12px rgba(75,255,155,.6);margin-bottom:4px}
.loginbox .syssub{font-size:.72rem;color:#5fbf85;margin-bottom:20px;letter-spacing:1px}
.fieldrow{display:flex;align-items:center;gap:9px;margin:10px 0}
.fieldrow label{flex:0 0 auto;font-size:.82rem;color:#bfeccc}
.fieldrow input{
  flex:1;min-width:0;padding:8px 10px;font-family:'Courier New',monospace;font-size:.95rem;
  background:#0a150a;color:var(--phos);border:2px inset #3a3a3a;border-radius:0
}
.fieldrow input:focus{outline:2px solid var(--phos);outline-offset:-2px}
.retrobtn{
  font-family:'Courier New',monospace;font-size:.86rem;padding:9px 18px;cursor:pointer;color:#0a150a;
  background:linear-gradient(180deg,#e8e8e8,#b0b0b0);border:2px outset #efefef;border-radius:0;
  box-shadow:1px 1px 0 #000;letter-spacing:1px;font-weight:700
}
.retrobtn:active{border-style:inset;transform:translate(1px,1px);box-shadow:none}
.retrobtn.prim{background:linear-gradient(180deg,#5b9bd8,#1f5fa8);color:#fff;border-color:#9dc6ec}
.retrobtn:disabled{opacity:.5;cursor:not-allowed}
.warnbox{margin-top:14px;padding:11px 13px;border:2px solid var(--amber);background:rgba(255,176,0,.1);
  color:#ffd98a;font-size:.78rem;line-height:1.55;text-align:left}
.warnbox b{color:var(--amber)}
.tipname{margin-top:12px;font-size:.72rem;color:#5fbf85;cursor:pointer;text-decoration:underline}
.hintrow{margin-top:16px;font-size:.68rem;color:#4d9b6d;letter-spacing:.5px}

/* ---------- DESKTOP ---------- */
.desktop{min-height:100%;display:flex;flex-direction:column;background:#008080}
.dt-icons{display:flex;gap:12px;flex-wrap:wrap;padding:12px 10px 4px}
.dt-icon{width:82px;text-align:center;cursor:pointer;color:#fff;font-size:.66rem;padding:6px 4px;border-radius:3px;
  text-shadow:1px 1px 2px #000;line-height:1.25}
.dt-icon .ico{font-size:30px;display:block;filter:drop-shadow(1px 1px 2px rgba(0,0,0,.6))}
.dt-icon:hover{background:rgba(0,0,0,.18)}
.dt-icon.sel{background:rgba(0,0,0,.32)}
.desk-body{flex:1;padding:6px 10px 12px;min-height:0}
.taskbar{
  display:flex;align-items:center;gap:8px;padding:4px 6px;background:var(--gray);
  border-top:2px solid var(--graylt);font-size:.72rem;flex-wrap:wrap
}
.taskbar .startbtn{
  display:flex;align-items:center;gap:6px;padding:3px 9px;background:linear-gradient(180deg,#e8e8e8,#b0b0b0);
  border:2px outset #efefef;border-radius:0;font-weight:700;cursor:pointer;font-size:.72rem;letter-spacing:.5px
}
.taskbar .startbtn:active{border-style:inset}
.taskbar .tbsep{flex:1}
.taskbar .tbitem{padding:3px 10px;background:linear-gradient(180deg,#e8e8e8,#b0b0b0);border:2px outset #efefef;
  display:flex;align-items:center;gap:5px;font-size:.7rem;cursor:pointer;max-width:38vw;overflow:hidden;white-space:nowrap}
.taskbar .tray{padding:3px 9px;background:var(--graylt);border:2px inset #efefef;display:flex;gap:9px;align-items:center;font-size:.7rem}

/* ---------- janelas Win95 ---------- */
.win95{
  background:var(--gray);border:2px outset #efefef;border-radius:0;padding:0;margin-bottom:12px;
  box-shadow:2px 3px 0 rgba(0,0,0,.35)
}
.tbar{
  display:flex;align-items:center;gap:7px;padding:4px 6px;margin:0 0 8px;
  background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;font-weight:700;font-size:.8rem;
  letter-spacing:.4px;cursor:default
}
.tbar .tico{font-size:.95rem}
.tbar .tx{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbar .tbtns{display:flex;gap:3px}
.tbar .tbtns span{width:16px;height:14px;background:var(--gray);border:2px outset #efefef;border-radius:0;
  display:grid;place-items:center;font-size:.55rem;color:#000;font-weight:900}
.winbody{padding:12px}

/* ---------- conteúdo dentro da tela ---------- */
.screen .wrap{max-width:none;margin:0;padding:0}
.screen .panel{
  background:var(--gray);border:2px outset #efefef;border-radius:0;padding:0;color:#000;
  box-shadow:2px 3px 0 rgba(0,0,0,.3);animation:rise .3s ease both;margin-bottom:10px
}
.screen .panel>.ptitle{
  background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;margin:0;
  padding:5px 9px;font-size:.8rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap
}
.screen .panel>.ptitle .badge{background:#fff;color:var(--navy);border-radius:0;font-size:.62rem;padding:2px 7px}
.screen .muted{color:#33383f}
.screen .tag{background:var(--graylt);color:#222;border:1px solid var(--graysh);border-radius:0;font-size:.6rem}
.screen .btn{
  font-family:'MS Sans Serif',Tahoma,sans-serif;border-radius:0;border:2px outset #efefef;
  background:linear-gradient(180deg,#e8e8e8,#b0b0b0);color:#000;font-weight:700;
  box-shadow:1px 1px 0 #000;padding:7px 15px;font-size:.8rem;letter-spacing:.2px
}
.screen .btn:hover{background:linear-gradient(180deg,#f4f4f4,#c6c6c6);transform:none;box-shadow:1px 1px 0 #000;border-color:#fff}
.screen .btn:active{border-style:inset;transform:translate(1px,1px);box-shadow:none}
.screen .btn:disabled{background:var(--gray);color:var(--graysh);border-color:var(--gray);box-shadow:none;filter:none}
.screen .btn.primary{background:linear-gradient(180deg,#5b9bd8,#1f5fa8);color:#fff;border-color:#9dc6ec}
.screen .btn.ok{background:linear-gradient(180deg,#7fc98a,#2e7d3c);color:#fff;border-color:#bfe6c6}
.screen .btn.danger{background:linear-gradient(180deg,#e07a7a,#a01818);color:#fff;border-color:#f0b0b0}
.screen .btn.ghost{background:linear-gradient(180deg,#e8e8e8,#b0b0b0);color:#000}

/* HUD dentro da tela */
.screen .hud{
  background:var(--gray);border:2px outset #efefef;border-radius:0;margin:0 0 10px;padding:6px 8px;
  box-shadow:1px 2px 0 rgba(0,0,0,.3);gap:10px;position:static
}
.screen .hearts{letter-spacing:1px}
.screen .score{color:#0000a8;text-shadow:none;font-family:'Courier New',monospace}
.screen .pip{background:var(--graylt);color:#333;border:1px solid var(--graysh);border-radius:0;width:24px;height:24px;font-size:.7rem}
.screen .pip.done{background:#2e7d3c;color:#fff;border-color:#1c5426;box-shadow:none}
.screen .pip.cur{background:linear-gradient(180deg,#5b9bd8,#1f5fa8);color:#fff;border-color:#9dc6ec;box-shadow:none}
.screen .ph-name{color:#0000a8;text-shadow:none;font-size:.72rem}

/* componentes do jogo na tela */
.screen .mem-animal{background:var(--graylt);border:2px inset #efefef;border-radius:0}
.screen .mem-animal .l{color:#333}
.screen .mem-animal:hover:not(.locked){background:#dfe8f5;border-color:#1f5fa8;box-shadow:none;transform:none}
.screen .mem-animal.picked{background:#b8d4f0;border:2px inset #4a7ab5}
.screen .mem-animal.picked::after{color:#0a4a0a}
.screen .seq-slot{background:var(--graylt);border:2px inset #efefef;border-radius:0}
.screen .seq-slot.on{background:#d8e8f8;border:2px outset #9dc6ec;box-shadow:none}
.screen .timebar{background:var(--graylt);border:2px inset #efefef;border-radius:0;height:14px}
.screen .timebar i{background:linear-gradient(90deg,#2e7d3c,#4bff9b)}
.screen .timebar.low i{background:linear-gradient(90deg,#a01818,#ff6b6b)}
.screen .streak{color:#a01818}
.screen .counter{color:#000}
.screen .rounds{justify-content:flex-start}
.screen .rd{background:var(--graysh);border-radius:0;width:28px}
.screen .rd.on{background:linear-gradient(90deg,var(--navy2),var(--navy));box-shadow:none}
.screen .steps{justify-content:flex-start}
.screen .step{background:var(--graylt);border:2px inset #efefef;border-radius:0;color:#333}
.screen .step.cur{background:#b8d4f0;border:2px outset #1f5fa8;color:#000080;box-shadow:none}
.screen .step.done{background:#bfe6c6;border:2px outset #2e7d3c;color:#0a4a0a}
.screen .piece,.screen .card,.screen .news{background:var(--graylt);border:2px outset #efefef;border-radius:0;color:#000}
.screen .piece:hover,.screen .card:hover,.screen .news:hover{background:#dfe8f5;border-color:#1f5fa8;box-shadow:1px 1px 0 #000;transform:none}
.screen .card.safe{background:#c8e6c8;border-color:#2e7d3c}
.screen .card.bad{background:#f0c8c8;border-color:#a01818}
.screen .card.bad:hover{background:#ffdcdc;box-shadow:1px 1px 0 #000;border-color:#a01818}
.screen .checks .chk{background:var(--graylt);border:1px solid var(--graysh);color:#333;border-radius:0}
.screen .checks .chk.ok{background:#c8e6c8;border-color:#2e7d3c;color:#0a4a0a}
.screen .chk.no{color:#444}
.screen .slot{background:transparent;border:1px dashed var(--graysh);border-radius:0}
.screen .slot.filled{background:rgba(31,95,168,.14);border-color:var(--navy)}
.screen .avatar-stage .panel,.screen #profilePanel{background:var(--graylt);border:2px inset #efefef;border-radius:0}
.screen #avatarBox{background:linear-gradient(180deg,#dce8f5,#c2d2e6);border:2px inset #efefef;border-radius:0;box-shadow:none}
.screen #profilePanel{background:var(--graylt)}
.screen #profilePanel.over{background:#c8e6c8;border:2px inset #2e7d3c;box-shadow:none}
.screen .prot{background:#c8e6c8;border:1px solid #2e7d3c;border-radius:0;color:#000}
.screen .alert-box{background:#ffd0d0;border:2px solid #a01818;color:#6b0000;border-radius:0}
.screen .audit .arow{background:var(--graylt);border:1px solid var(--graysh);color:#000;border-radius:0}
.screen .mail{background:#f4f4f4;border:2px inset #efefef;border-radius:0;box-shadow:none}
.screen .mail-head{background:#d0d8e8;border-bottom:1px solid var(--graysh);color:#12203a}
.screen .sig{background:var(--graylt);border:1px solid var(--graysh);border-radius:0;opacity:.4}
.screen .sig.on{background:#c8e6c8;border:2px solid #2e7d3c;box-shadow:none;opacity:1}
.screen .hint{background:#fff6d0;border:1px dashed #b8860b;color:#5a3d00;border-radius:0}
.screen .pwbox{background:var(--graylt);border:2px inset #efefef;border-radius:0}
.screen .pwfield{background:#0a150a;color:var(--phos);border:2px inset #3a3a3a;border-radius:0}
.screen .pwfield.ok{border-color:var(--phos);box-shadow:none}
.screen .pwbar{background:#0a0a0a;border:2px inset #3a3a3a;border-radius:0;height:16px}
.screen .req{background:var(--graylt);border:1px solid var(--graysh);color:#333;border-radius:0}
.screen .req.ok{background:#c8e6c8;border-color:#2e7d3c;color:#0a4a0a}
.screen .key{background:linear-gradient(180deg,#e8e8e8,#b0b0b0);border:2px outset #efefef;border-radius:0;color:#000;box-shadow:1px 1px 0 #000}
.screen .key:active{border-style:inset;transform:translate(1px,1px);box-shadow:none}
.screen .hacker{background:#2a1414;border:1px solid #a01818;border-radius:0}
.screen .hackbar{background:#0a0a0a;border:1px solid #a01818;border-radius:0}
.screen .lesson{background:linear-gradient(150deg,#eef4ff,#e6ecf8);border:2px outset #efefef;border-radius:0;box-shadow:1px 1px 0 #000}
.screen .lesson .lk{color:var(--navy)}
.screen .lesson .lt{color:#000}
.screen .lesson .lp{color:#22303f}
.screen .lesson .la{background:#dff5e4;border:1px solid #2e7d3c;color:#0a3a18;border-radius:0}
.screen .lesson .st{background:#fff;border:1px solid var(--graysh)}
.screen .lesson .st span{color:#555}
.screen .lesson .st b{color:#a01818}
.screen .namebox{background:#e8eef8;border:2px inset #efefef;border-radius:0}
.screen .namebox input{background:#fff;color:#000;border:2px inset #efefef;border-radius:0;text-align:left}
.screen .otpbox{background:#eefaf0;border:2px outset #efefef;border-radius:0}
.screen .otpcode{color:#0a4a0a;text-shadow:none}
.screen .otpinput{background:#fff;color:#000;border:2px inset #efefef;border-radius:0}
.screen .gamebar{background:var(--graylt);border:2px inset #efefef;padding:6px 8px}
.screen .skill{background:linear-gradient(180deg,#e8e8e8,#b0b0b0);border:2px outset #efefef;border-radius:0;color:#000;box-shadow:1px 1px 0 #000;font-family:'MS Sans Serif',Tahoma,sans-serif}
.screen .skill.act{background:linear-gradient(180deg,#b8a6ea,#6b4fc0);color:#fff;border-color:#c9bcf5}
.screen .gauge{background:var(--graylt);border:1px solid var(--graysh)}
.screen .hpbar{background:var(--graylt);border:1px solid var(--graysh)}
.screen .hpdot{background:#1f5fa8;box-shadow:none;border-radius:0}
.screen .pwslot{background:var(--graylt);border:1px solid var(--graysh);border-radius:0;color:#000}
.screen #gameWrap{border:2px inset #efefef;border-radius:0;box-shadow:none;background:#000}
.screen .padbtn{background:linear-gradient(180deg,#e8e8e8,#b0b0b0);border:2px outset #efefef;border-radius:0;color:#000}
.screen .wavebanner{color:#fff;text-shadow:2px 2px 0 #000;font-family:'Courier New',monospace}
.screen .bossbar .bt{color:#fff;text-shadow:1px 1px 0 #000}
.screen .bossbar .bb{background:#2a0000;border:1px solid #a01818}

/* modal */
.screen .modal{background:rgba(0,20,0,.72);backdrop-filter:none}
.screen .modal .box{
  background:var(--gray);border:2px outset #efefef;border-radius:0;color:#000;box-shadow:3px 4px 0 rgba(0,0,0,.5);padding:0
}
.screen .modal .box>*{padding-left:14px;padding-right:14px}
.screen .modal .box .big-emo{filter:none}
.screen .modal .box h2{background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;padding:6px 14px;font-size:.92rem;margin:0 0 12px}
.screen .modal .muted{color:#222}
.screen .btn-row{padding:0 14px 14px}
.screen .btn-row .btn{font-family:'MS Sans Serif',Tahoma,sans-serif}

/* toast dentro da tela */
#toast{
  position:absolute;left:50%;bottom:52px;transform:translate(-50%,140%);z-index:600;
  background:#ffffcc;border:2px outset #efefef;color:#000;border-radius:0;
  box-shadow:2px 2px 0 rgba(0,0,0,.5);font-size:.78rem;max-width:92%;padding:8px 14px
}
#toast.good{background:#dff5e4;border-color:#2e7d3c}
#toast.bad{background:#ffd6d6;border-color:#a01818}
#toast.warn{background:#fff3c4;border-color:#b8860b}
#ghost{background:#e8f0ff;border:1px solid var(--navy);color:#000;box-shadow:1px 2px 0 rgba(0,0,0,.5);border-radius:0;font-size:.72rem}
.confetti{z-index:700}
.stat{background:var(--graylt);border:2px outset #efefef;border-radius:0}
.stat .v{color:#0000a8;text-shadow:none}
.stat .k{color:#444}
.tips .tip{background:#dff5e4;border:1px solid #2e7d3c;border-radius:0;color:#000}
.rank{color:#a01818 !important;text-shadow:none !important}
.rank.g1{color:#b8860b !important}
.rank.g2{color:#0000a8 !important}
.rank.g3{color:#2e7d3c !important}
.hero{background:var(--gray);border:2px outset #efefef;border-radius:0;box-shadow:2px 3px 0 rgba(0,0,0,.3);color:#000}
.hero .lock{filter:none;animation:none}
.brand h1{background:none;-webkit-text-fill-color:#000080;color:#000080;filter:none;
  font-family:'MS Sans Serif',Tahoma,sans-serif;text-shadow:1px 1px 0 #fff}
.brand .sub{color:#333}
.mcard{background:var(--graylt);border:2px outset #efefef;border-radius:0;color:#000}
.mcard:hover{background:#dfe8f5;border-color:#1f5fa8;box-shadow:1px 1px 0 #000;transform:none}
.mcard b{color:#000080}
.mcard small{color:#333}
.menu-grid{justify-content:flex-start}
.menu-grid .mcard{min-width:150px}
.timebar.low{animation:none;border-color:#a01818}
.mem-animal.press{animation:none}
.shake{animation:shake .4s}

/* FASE 3 */
.mail{border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.14);
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.25));box-shadow:0 0 26px rgba(0,0,0,.5)}
.mail-head{padding:12px 14px;background:rgba(0,240,255,.08);border-bottom:1px solid rgba(255,255,255,.1);font-size:.82rem;color:#c6d3ff;word-break:break-all}
.mail-head b{color:#fff}
.mail-body{padding:16px;font-size:.9rem;line-height:1.8}
.sign{display:inline-block;padding:1px 6px;border-radius:7px;cursor:pointer;transition:.18s;
  border:1px dashed rgba(255,217,61,.55);background:rgba(255,217,61,.09);color:#ffe9a8}
.sign:hover{background:rgba(255,217,61,.26);transform:scale(1.04)}
.sign.found{background:rgba(37,244,167,.28);border:1px solid var(--green);color:#dcfff2;box-shadow:0 0 14px rgba(37,244,167,.45)}
.sign.miss{animation:shake .4s;border-color:var(--red);background:rgba(255,59,92,.25)}
.signals-bar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.sig{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:1.05rem;
  border:1px solid rgba(255,255,255,.14);opacity:.32;transition:.3s}
.sig.on{opacity:1;border-color:var(--green);background:rgba(37,244,167,.22);box-shadow:0 0 14px rgba(37,244,167,.5);transform:scale(1.08)}
.debrief{text-align:left;margin-top:12px;display:flex;flex-direction:column;gap:7px}
.dline{display:flex;gap:9px;align-items:flex-start;font-size:.8rem;padding:8px 11px;border-radius:10px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1)}
.dline.hit{border-color:rgba(37,244,167,.4);background:rgba(37,244,167,.09)}
.dline.missed{border-color:rgba(255,217,61,.4);background:rgba(255,217,61,.08)}

/* FASE 4 */
.feed{display:flex;flex-direction:column;gap:11px;margin-top:12px}
.news{border-left:4px solid var(--blue);padding:12px 14px;line-height:1.5}
.news .meta{font-size:.68rem;color:#8ea2d6;letter-spacing:.6px;margin-bottom:5px;display:flex;gap:8px;flex-wrap:wrap}
.news .h{font-weight:700;color:#fff;font-size:.92rem}
.news .d{font-size:.79rem;color:#9fb0dd}
.news.ok{border-color:var(--green);background:linear-gradient(90deg,rgba(37,244,167,.14),transparent);opacity:.8;cursor:default}
.news.err{border-color:var(--red);animation:shake .45s}
.news.done{pointer-events:none}
.clues{margin-top:9px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.clue{font-size:.72rem;padding:6px 9px;border-radius:9px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);color:#a9b8e6}
.clue b{display:block;color:#fff;font-size:.66rem;letter-spacing:.8px;margin-bottom:2px;opacity:.7}
.clue.bad{border-color:rgba(255,59,92,.45);color:#ffc2cd}
.clue.good{border-color:rgba(37,244,167,.45);color:#c6ffe8}
#trashZone{margin-top:14px;min-height:112px;border-radius:18px;border:2px dashed rgba(255,217,61,.45);
  background:rgba(255,217,61,.07);display:grid;place-items:center;text-align:center;padding:12px;transition:.2s}
#trashZone .t{font-size:2.4rem}
#trashZone.over{border-color:var(--yellow);background:rgba(255,217,61,.2);box-shadow:0 0 26px rgba(255,217,61,.35)}
.feed-wrap{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:840px){.feed-wrap{grid-template-columns:1.4fr .75fr;align-items:start}}
.hint{font-size:.77rem;color:var(--yellow);border:1px dashed rgba(255,217,61,.4);padding:9px 12px;border-radius:11px;
  background:rgba(255,217,61,.07);margin-top:12px;text-align:left}
.hint ul{margin:6px 0 0 16px;line-height:1.6}

/* FASE 5 */
#gameWrap{position:relative;border-radius:18px;overflow:hidden;border:1px solid rgba(0,240,255,.35);box-shadow:0 0 36px rgba(0,240,255,.2)}
#cv{display:block;width:100%;height:auto;touch-action:none;background:radial-gradient(ellipse at 50% 0%,#0d1445,#04021a 70%)}
#overlayC{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px;background:rgba(4,2,20,.9);backdrop-filter:blur(3px)}
#overlayC .t{font-size:1.4rem;font-weight:800;color:var(--cyan);text-shadow:0 0 18px var(--cyan);margin-bottom:6px}
.gamebar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
.skill{border:1px solid rgba(0,240,255,.4);border-radius:13px;padding:9px 14px;font-weight:800;font-size:.78rem;
  background:rgba(0,240,255,.1);color:var(--cyan);cursor:pointer;transition:.2s;letter-spacing:1px;font-family:inherit}
.skill:hover{background:rgba(0,240,255,.24);box-shadow:0 0 18px rgba(0,240,255,.4)}
.skill.act{border-color:var(--purple);color:var(--purple);background:rgba(168,85,247,.16);box-shadow:0 0 16px rgba(168,85,247,.4)}
.pads{display:none;gap:12px;justify-content:center;margin-top:14px}
.pads .col{display:flex;flex-direction:column;gap:10px}
.padbtn{width:64px;height:64px;border-radius:18px;font-size:1.5rem;display:grid;place-items:center;
  background:rgba(0,240,255,.13);border:1px solid var(--cyan);color:var(--txt);cursor:pointer;user-select:none}
.padbtn:active{background:rgba(0,240,255,.35)}
@media(pointer:coarse){.pads{display:flex}}

<body>

    </div>
  </div>
  <div class="stand"></div>
  <div class="standbase"></div>
</div>

<div id="toast"></div>
<div id="ghost" class="hide"></div>

<script>
"use strict";
/* =====================================================================
   CIBERDEFESA — Jogo educativo de Segurança Digital
   HTML + CSS + JS puros. Sem bibliotecas externas.
   ===================================================================== */

/* ------------------------------ ESTADO ------------------------------- */
const TOTAL = 5;
const S = { phase:0, lives:3, maxLives:3, score:0, done:new Set(), user:'' };
let BOOTED=false;

const app = document.getElementById('app');
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const rnd = a=>a[Math.floor(Math.random()*a.length)];
const ri  = (a,b)=>Math.floor(Math.random()*(b-a+1))+a;

/* =====================================================================
   BOOT DO COMPUTADOR — POST, login e área de trabalho
   ===================================================================== */
const CLOCK = (()=>{ let m=0; setInterval(()=>{
  m=(m+1)%1440;
  const hh=String(Math.floor(m/60)).padStart(2,'0'), mm=String(m%60).padStart(2,'0');
  const c=document.getElementById('tbClock'); if(c) c.textContent=hh+':'+mm;
},1000); })();

/* nomes de usuário consideredos fracos na login (lição de segurança) */
const WEAK_USERS=['admin','root','administrador','user','usuario','teste','test','guest','convidado',
                  'anonimo','default','123456','qwerty','alex','joao','maria'];

const POST=[
  ['CYBERDEFESA BIOS v4.86  (c) 1994 SecureNet Labs',''],
  ['','ok'],
  ['Turbo CPU .................. 80486DX2  66 MHz','ok'],
  ['Memory Test ............... '+ri(8192,16384)+' KB','ok'],
  [''  ,''],
  ['Detecting IDE Primary Master ....... HARDDISK','ok'],
  ['Detecting IDE Secondary Master ..... CD-ROM','ok'],
  ['Initializing Plug and Play Cards .....','ok'],
  ['Realtek NE2000 Ethernet Adapter .....','ok'],
  ['Sound Card: Sound Blaster 16 ........','ok'],
  ['','ok'],
  ['Verifying DMI Pool Data .............','ok'],
  ['Loading boot sector from hard disk ...','ok'],
  ['','ok']
];

window.reboot=function(){ closeModal(); SYS='boot'; BOOTED=false; startBoot(); };

function startBoot(){
  SYS='boot';
  clearTimers();                       // garante uma sequência de boot limpa
  const boot=$('#boot'), login=$('#login'), desk=$('#desktop');
  boot.classList.remove('hide'); login.classList.add('hide'); desk.classList.add('hide');
  boot.innerHTML='';
  let i=0;

  const line=(txt,st)=>{
    const d=document.createElement('div');
    d.innerHTML= st==='ok' ? txt+' <span class="ok">[ OK ]</span>'
                : st==='amber' ? '<span class="amber">'+txt+'</span>'
                : '<span class="dim">'+txt+'</span>';
    boot.appendChild(d);
  };

  // cabeçalho
  line('CYBERDEFESA BIOS v4.86  (c) 1994 SecureNet Labs','amber');
  line('');
  const step=()=>{
    if(i>=POST.length){ loadOS(); return; }
    const [txt,st]=POST[i++];
    line(txt||' ',st);
    boot.scrollTop=boot.scrollHeight;
    t(step, st==='ok'?90:150);
  };
  step();
}

function loadOS(){
  const boot=$('#boot');
  boot.innerHTML += `
  <div> </div>
  <div class="amber">Iniciando o CYBERDEFESA OS 3.1…</div>
  <div> </div>
  <div>Procurando dispositivos de rede security<span class="cursor"></span></div>`;
  const bar=document.createElement('div');
  bar.className='bootbar';
  bar.innerHTML='<i></i>';
  boot.appendChild(bar);
  const fill=bar.querySelector('i');
  let w=0;
  const grow=()=>{
    w+=ri(9,22);
    if(w<100){ fill.style.width=w+'%'; t(grow,110); }
    else{
      fill.style.width='100%';
      t(()=>{
        boot.innerHTML+=`
  <div> </div>
  <div class="ok">Rede protegida — Agente ZERO-DAY detectado</div>
  <div class="amber">Iniciando ambiente seguro. Aguarde…</div>`;
        boot.scrollTop=boot.scrollHeight;
        t(showLogin,700);
      },220);
    }
  };
  t(grow,300);
}

/* ---------------- LOGIN ---------------- */
let SYS='boot';               // boot -> login -> desktop (trava contra timers atrasados)

function showLogin(){
  if(SYS==='desktop') return;      // já entrou: nenhum timer atrasado reabre a tela
  SYS='login';
  const boot=$('#boot'), login=$('#login');
  boot.classList.add('hide');
  login.classList.remove('hide');
  login.innerHTML=`
    <div class="loginbox">
      <div class="sysname">CYBERDEFESA OS 3.1</div>
      <div class="syssub">PROGRAMA EDUCATIVO DE SEGURANÇA DIGITAL</div>
      <div style="font-size:2.6rem;line-height:1">🖥️</div>
      <div class="fieldrow">
        <label for="lgUser">Usuário:</label>
        <input id="lgUser" type="text" maxlength="18" autocomplete="off" spellcheck="false" placeholder="digite seu nome de agente">
      </div>
      <div class="fieldrow">
        <label for="lgPass">Senha:</label>
        <input id="lgPass" type="password" maxlength="24" placeholder="(pressione Enter para entrar)">
      </div>
      <div class="btn-row" style="justify-content:center">
        <button class="retrobtn prim" onclick="doLogin()">⏎ ENTRAR</button>
      </div>
      <div id="lgMsg"></div>
      <div class="hintrow">Dica: escolha um nome de agente — nunca seu nome real.</div>
    </div>`;
  const u=$('#lgUser');
  u.addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
  const p=$('#lgPass');
  p.addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
  u.addEventListener('input',liveCheck);
  t(()=>u.focus(),120);
}

function normUser(s){ return (s||'').trim().toLowerCase(); }

function liveCheck(){
  const box=$('#lgMsg'); if(!box) return;
  const nm=normUser($('#lgUser').value);
  box.innerHTML='';
  if(!nm) return;
  if(nm.length<3){
    box.innerHTML='<div class="warnbox">⚠️ <b>Muito curto.</b> Use pelo menos 3 caracteres.</div>';
  }else if(/^\d+$/.test(nm)){
    box.innerHTML='<div class="warnbox">⚠️ <b>Só números!</b> Pode ser seu telefone ou CPF — dados pessoais Facilitam golpes.</div>';
  }else if(/^\d{2}[\/\-.]\d{2}[\/\-.]\d{2,4}$/.test(nm)){
    box.innerHTML='<div class="warnbox">⚠️ <b>Isso é uma data!</b> Nunca use data de nascimento em nome de usuário.</div>';
  }else if(WEAK_USERS.includes(nm)){
    box.innerHTML='<div class="warnbox">⚠️ <b>Nome muito previsível.</b> Hackers testam "admin", "root" e "user" primeiro.</div>';
  }else if(nm.split(/\s+/).length>=2){
    box.innerHTML='<div class="warnbox">⚠️ <b>Parece seu nome completo.</b> Use um apelido, não dados reais.</div>';
  }else{
    box.innerHTML='<div class="warnbox" style="border-color:#2e7d3c;background:rgba(46,125,60,.12);color:#0a3a18">✅ <b>Nome de agente seguro.</b> Não revela nada sobre você.</div>';
  }
}

window.doLogin=function(){
  const nm=normUser($('#lgUser').value);
  if(nm.length<3){ toast('Digite um usuário com 3+ caracteres','bad'); liveCheck(); return; }
  const weak=/^\d+$/.test(nm) || WEAK_USERS.includes(nm) || nm.split(/\s+/).length>=2;
  if(weak){
    $('#lgMsg').innerHTML=`
      <div class="warnbox">⚠️ <b>Este nome é fácil de adivinhar.</b><br>
        Nomes previsíveis (admin, root, 123456) e dados pessoais são os primeiros testados por quem quer invadir.<br>
        Entrar mesmo assim ou usar um apelido seguro?</div>
      <div class="btn-row" style="justify-content:center">
        <button class="retrobtn" onclick="doLogin()">Entrar assim mesmo</button>
        <button class="retrobtn prim" onclick="suggestName()">Usar um nome seguro</button>
      </div>`;
    return;
  }
  enterDesktop(nm);
};

window.suggestName=function(){
  const sug=['Zero-Day','Guardiao','FirewallFox','CyberNinja','ByteShield','RexCibernetico',
             'Agente404','KernelPanic','MuroDeFogo','HackerDoBem'];
  const pick=sug[Math.floor(Math.random()*sug.length)];
  $('#lgUser').value=pick;
  liveCheck();
  toast('Sugestão aplicada: '+pick,'good');
};

function enterDesktop(user){
  SYS='desktop';
  clearTimers();                  // cancela qualquer etapa de boot ainda pendente
  const login=$('#login'), desk=$('#desktop');
  login.classList.add('hide');
  desk.classList.remove('hide');
  BOOTED=true;
  S.user=user;
  bootSound();
  menu();
}

function openMenu(){ menu(); }

/* ---------------- área de trabalho (ícones) ---------------- */
const DESKTOP_ICONS=[
  {e:'🎮',n:'CIBERDEFESA', f:()=>menu()},
  {e:'🗺️',n:'Missões',    f:()=>showMissions()},
  {e:'📖',n:'Tutorial',    f:()=>showTutorial(true)},
  {e:'📝',n:'Minhas Notas', f:()=>showNotes()}
];
window.showNotes=function(){
  modal({emo:'📝',title:'BLOCO DE NOTAS',
    body:`<div style="text-align:left;font-size:.82rem;line-height:1.7">
      Usuário atual: <b>${S.user||'visitante'}</b><br><br>
      Lembre-se sempre:<br>
      • Senha forte e única para cada site<br>
      • Ative a verificação em 2 etapas (2FA)<br>
      • Desconfie delinks e prêmios fáceis<br>
      • Confie em licença: confira fonte e data<br>
      • Mantenha o sistema e os apps atualizados
    </div>`,
    btns:[{t:'Fechar',cls:'btn'}]});
};

function renderIcons(){
  const box=document.getElementById('dtIcons'); if(!box) return;
  box.innerHTML=DESKTOP_ICONS.map((ic,i)=>
    `<div class="dt-icon" data-i="${i}"><span class="ico">${ic.e}</span>${ic.n}</div>`).join('');
  $$('#dtIcons .dt-icon').forEach(el=>{
    el.addEventListener('click',()=>DESKTOP_ICONS[+el.dataset.i].f());
  });
}

/* ---------------- som de boot / PC ---------------- */
let MOTIF=null;
function bootSound(){
  stopMusic();
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const notes=[523.25,659.25,783.99,1046.5];
    MOTIF=notes.map((f,i)=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type='square'; o.frequency.value=f;
      const st=AC.currentTime+i*0.14;
      g.gain.setValueAtTime(.0001,st);
      g.gain.exponentialRampToValueAtTime(.045,st+0.02);
      g.gain.exponentialRampToValueAtTime(.0001,st+0.20);
      o.connect(g); g.connect(AC.destination);
      o.start(st); o.stop(st+0.24);
      return o;
    });
  }catch(e){}
}
function stopMusic(){ /* sons são curtos; nada a parar */ }

/* -------------------------- TIMERS / LOOP ---------------------------- */
let TIMERS = [];
function t(fn, ms){ const id=setTimeout(fn,ms); TIMERS.push(id); return id; }
function every(fn, ms){ const id=setInterval(fn,ms); TIMERS.push(id); return id; }
function clearTimers(){ TIMERS.forEach(id=>{clearTimeout(id);clearInterval(id);}); TIMERS=[]; }

let retryHook = ()=>{};
function setRetry(fn){ retryHook = fn; }

/* ------------------------------ SOM ---------------------------------- */
let AC = null;
function sfx(freq=440,dur=.09,type='sine',vol=.05){
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+dur);
  }catch(e){}
}
const sfxGood=()=>{ sfx(660,.1); t(()=>sfx(990,.15),90); };
const sfxBad =()=>{ sfx(150,.22,'sawtooth',.06); };
const sfxShot=()=>sfx(760,.045,'square',.022);
const sfxBoom=()=>{ sfx(110,.15,'sawtooth',.045); t(()=>sfx(70,.18,'sawtooth',.04),40); };

/* ----------------------------- FEEDBACK ------------------------------ */
let toastT;
function toast(msg,kind=''){
  const el=$('#toast'); el.textContent=msg; el.className='show '+kind;
  clearTimeout(toastT); toastT=setTimeout(()=>el.className=kind,2800);
}

let lastScore=0;
function addScore(n){
  S.score += Math.round(n);
  const el=$('#scoreVal');
  if(el){ el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  hud();
}

function hud(){
  const el=$('#hud'); if(!el) return;
  const hearts=Array.from({length:S.maxLives},(_,i)=>
    `<span class="${i<S.lives?'':'off'}">${i<S.lives?'❤️':'🖤'}</span>`).join('');
  const pips=Array.from({length:TOTAL},(_,i)=>{
    const n=i+1, d=S.done.has(n), c=(S.phase===n&&!d)?'cur':'';
    return `<div class="pip ${d?'done':''} ${c}" title="Fase ${n}">${d?'✓':n}</div>`;
  }).join('');
  el.innerHTML=
    `<div class="grp"><span class="tag">Vidas</span><div class="hearts">${hearts}</div></div>`+
    `<div class="grp"><span class="tag">Pontos</span><span class="score" id="scoreVal">${S.score}</span></div>`+
    `<div class="grp"><span class="tag">Progresso</span><div class="prog">${pips}</div></div>`+
    `<div class="grp"><span class="ph-name">${phaseName(S.phase)}</span></div>`+
    `<div class="grp"><button class="mapbtn" onclick="showMissions()" title="Trocar de fase">🗺️ Missões</button></div>`;
}

/* ======================= MAPA DE MISSÕES ============================= */
const PHASE_INFO=[
  {n:1, e:'🧠', t:'Memória',        d:'Crie e repita sua sequência.'},
  {n:2, e:'👤', t:'Perfil Seguro',  d:'Avatar, senha forte e 2FA.'},
  {n:3, e:'🎣', t:'Phishing',       d:'Ache os sinais e denuncie.'},
  {n:4, e:'📰', t:'Fake News',      d:'Separe mentira de verdade.'},
  {n:5, e:'🚀', t:'Defesa Digital', d:'Space shooter contra vírus.'}
];

window.goPhase=function(n){
  closeModal();
  n=Math.max(1,Math.min(TOTAL,parseInt(n,10)||1));
  S.phase=n;
  [p1,p2,p3,p4,p5][n-1]();
  toast('🗺️ Iniciando fase '+n+' de '+TOTAL,'good');
};

window.showMissions=function(){
  const done=S.done.size;
  modal({
    emo:'🗺️', title:'MAPA DE MISSÕES',
    body:`Jogue <b>qualquer fase</b>, na ordem que quiser.<br>
      <span class="muted">Concluídas <b>${done}/${TOTAL}</b> · Pontos <b>${S.score}</b> · Vidas <b>${S.lives}</b></span>
      <div class="maplist">${PHASE_INFO.map(p=>`
        <button class="maprow ${S.done.has(p.n)?'done':''} ${S.phase===p.n?'cur':''}"
                data-goto="${p.n}">
          <span class="mi">${p.e}</span>
          <span class="mt"><b>${p.n}. ${p.t}</b><small>${p.d}</small></span>
          <span class="ms">${S.done.has(p.n)?'✅':(S.phase===p.n?'▶ AGORA':'JOGAR')}</span>
        </button>`).join('')}</div>
      <button class="btn ok" style="width:100%;margin-top:10px" data-final="1">
        🏁 Ver tela final${done<TOTAL?` (${done}/${TOTAL})`:' ✅'}</button>`,
    btns:[{t:'↩ Voltar', cls:'btn ghost'}]
  });
  $$('.modal [data-goto]').forEach(b=>
    b.addEventListener('click',()=>window.goPhase(+b.dataset.goto)));
  const f=$('.modal [data-final]');
  if(f) f.addEventListener('click',()=>{ closeModal(); finalScreen(); });
};

function phaseName(p){
  return ['','🧠 1/5 · Memória','👤 2/5 · Perfil Seguro','🎣 3/5 · Phishing','📰 4/5 · Fake News','🚀 5/5 · Defesa Digital'][p]||'';
}

function screen(html){ clearTimers(); app.innerHTML=html; hud(); const tb=document.getElementById('tbTask'); if(tb) tb.innerHTML='📁 '+(BOOTED?phaseName(S.phase)||'Menu':'—'); }

function modal({emo='🤖',title='',body='',btns=[]}){
  closeModal();
  const m=document.createElement('div');
  m.className='modal';
  m.innerHTML=`<div class="box"><div class="big-emo">${emo}</div>
    <h2 style="font-size:1.4rem;margin:8px 0">${title}</h2>
    <div class="muted" style="margin-bottom:6px">${body}</div>
    <div class="btn-row">${btns.map((b,i)=>`<button class="${b.cls||'btn'}" data-i="${i}">${b.t}</button>`).join('')}</div></div>`;
  document.body.appendChild(m);
  m.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    const it=btns[+b.dataset.i]; closeModal();
    if(it&&it.act) it.act();
  });
}
function closeModal(){ $$('.modal').forEach(m=>m.remove()); }

function confetti(){
  const c=document.createElement('div'); c.className='confetti'; document.body.appendChild(c);
  const cols=['#00f0ff','#a855f7','#ff3ea5','#25f4a7','#ffd93d'];
  for(let i=0;i<80;i++){
    const b=document.createElement('div'); b.className='cbit';
    b.style.left=Math.random()*100+'vw'; b.style.top='-20px';
    b.style.background=rnd(cols);
    b.style.animationDuration=(1.5+Math.random()*1.9)+'s';
    b.style.animationDelay=(Math.random()*.6)+'s';
    c.appendChild(b);
  }
  t(()=>c.remove(),4200);
}

function loseLife(msg){
  if(S.lives<=0) return;
  S.lives--; sfxBad();
  const hb=$('.hearts'); if(hb){ hb.classList.add('pop'); t(()=>hb.classList.remove('pop'),500); }
  hud();
  if(S.lives<=0){
    toast('💔 Sem vidas!','bad');
    // setTimeout puro: o modal precisa aparecer mesmo se a fase re-renderizar
    setTimeout(()=>modal({
      emo:'💔', title:'VOCÊ PERDEU TODAS AS VIDAS',
      body: msg||'Mas todo agente pode se reerguer. Tente novamente!',
      btns:[
        {t:'💚 Continuar com 2 vidas', cls:'btn ok', act:()=>{ S.lives=2; hud(); retryHook(); }},
        {t:'↺ Reiniciar jogo', cls:'btn primary', act:()=>startGame()}
      ]
    }),500);
    return;
  }
  toast(msg||'💔 Você perdeu uma vida!','bad');
}

/* ============================ HUD FIXO =============================== */
const HUD='<div class="hud" id="hud"></div>';

/* ============================== MENU ================================= */
function menu(){
  S.phase=0;
  screen(HUD+`
  <div class="hero">
    <div class="lock">🔐</div>
    <div class="brand"><h1>CIBERDEFESA</h1></div>
    <div class="brand"><div class="sub">Jogo educativo de Segurança Digital</div></div>
    <p class="muted" style="margin:14px auto 0;max-width:560px">
      Você é o agente <b style="color:var(--cyan)">ZERO-DAY</b>. Complete <b>5 missões</b>,

  addScore(200);
  const bonus=S.lives*50;
  addScore(bonus);

    body:`Bônus de fase <b>+200</b> · Bônus de vidas <b>+${bonus}</b><br><span class="muted">Próxima missão liberada.</span>`,
    btns:[{t:'▶ Próxima fase',cls:'btn primary',act:()=>p2start()}]});

function p2start(){ closeModal(); [p1,p2,p3,p4,p5][S.phase-1](); }

/* =====================================================================
   FASE 1 — MEMÓRIA PERSONALIZADA
   Cria a própria sequência (mín. 3) → observa → repete na ordem.
   Rodadas de 3 → 4 → 5 → 6. Cronômetro + streak de bônus.
   ===================================================================== */
const ANIMAIS=[
  {e:'🐱',n:'GATO'}, {e:'🐶',n:'CACHORRO'},
  {e:'🦁',n:'LEÃO'}, {e:'🐯',n:'TIGRE'}
];
const R1={chosen:[],seq:[],round:0,phase:'pick',input:[],streak:0,best:0};
const SIZES=[3,4,5,6];

function p1(){
  S.phase=1; setRetry(()=>p1());
  R1.chosen=[]; R1.seq=[]; R1.round=0; R1.phase='pick'; R1.input=[]; R1.streak=0;
  screen(HUD+`
  <div class="panel">
    <h2 class="ptitle"><span class="badge">FASE 1</span> Memória Personalizada 🧠</h2>
    <p class="muted" id="p1msg">Clique nos animais para montar <b>sua sequência</b> (mínimo 3, máximo 4).</p>

    <div class="rounds" id="p1rounds">${SIZES.map((_,i)=>`<div class="rd" id="rd${i}"></div>`).join('')}</div>

    <div class="mem-grid" id="p1grid">
      ${ANIMAIS.map((a,i)=>`<div class="mem-animal" data-i="${i}">
        <span class="e">${a.e}</span><span class="l">${a.n}</span></div>`).join('')}
    </div>

    <div class="timebar hide" id="p1timewrap"><i id="p1time"></i></div>
    <div class="seq-box" id="p1seq"></div>
    <div class="streak" id="p1streak"></div>

    <div class="btn-row">
      <button class="btn primary" id="p1go" onclick="p1Go()" disabled>Ver sequência ▶</button>
      <button class="btn ghost hide" id="p1rev" onclick="p1Rev()">↺ Rever</button>
      <button class="btn ghost hide" id="p1ok" onclick="p1Check()">✓ Confirmar</button>
    </div>
  </div>`);
  p1PickUI();
}

function p1PickUI(){
  R1.phase='pick'; R1.input=[];
  $('#p1msg').innerHTML='Clique nos animais para montar <b>sua sequência</b> (mínimo 3, máximo 4).';
  $('#p1go').classList.remove('hide'); $('#p1go').disabled=true;
  $('#p1ok').classList.add('hide'); $('#p1rev').classList.add('hide');
  $('#p1timewrap').classList.add('hide');
  p1Grid();
  $('#p1seq').innerHTML='<span class="muted" style="font-size:.82rem">Monte sua sequência acima…</span>';
}

function p1Grid(){
  $('#p1grid').innerHTML=ANIMAIS.map((a,i)=>`
    <div class="mem-animal ${R1.phase!=='pick'?'locked':''} ${R1.chosen.includes(i)?'picked':''}" data-i="${i}">
      <span class="e">${a.e}</span><span class="l">${a.n}</span></div>`).join('');
}

function p1Click(i){
  if(R1.phase!=='pick') return;
  if(R1.chosen.includes(i)) R1.chosen=R1.chosen.filter(x=>x!==i);
  else if(R1.chosen.length<4) R1.chosen.push(i);
  else { toast('Máximo de 4 animais','warn'); return; }
  sfx(500+i*45,.05);
  $('#p1go').disabled=R1.chosen.length<3;
  p1Grid();
  $('#p1seq').innerHTML=R1.chosen.map(x=>`<div class="seq-slot on"><span class="se">${ANIMAIS[x].e}</span><span class="sn">${ANIMAIS[x].n}</span></div>`).join('');
}

window.p1Go=function(){
  if(R1.chosen.length<3) return;
  const size=SIZES[R1.round];
  const pool=R1.chosen.slice(), seq=[];
  while(seq.length<size) seq.push(pool[seq.length%pool.length]);
  R1.seq=seq; R1.round++;
  R1.chosen=[];        // limpa a seleção para a próxima rodada
  $('#p1go').classList.add('hide');
  p1Show();
};

function p1Show(){
  R1.phase='show'; R1.input=[];
  $('#p1msg').innerHTML=`<b>Rodada ${R1.round}/${SIZES.length}</b> — Memorize a ordem dos <b>${R1.seq.length}</b> animais!`;
  $('#p1seq').innerHTML=R1.seq.map((_,i)=>`<div class="seq-slot" id="ps${i}"></div>`).join('');
  p1Grid();
  $('#p1timewrap').classList.add('hide');
  for(let i=0;i<SIZES.length;i++) $('#rd'+i).classList.toggle('on', i<R1.round-1);

  R1.seq.forEach((ai,i)=>t(()=>{
    const s=$('#ps'+i); if(!s||R1.phase!=='show') return;
    s.classList.add('on');
    s.innerHTML=`<span class="se">${ANIMAIS[ai].e}</span><span class="sn">${ANIMAIS[ai].n}</span>`;
    sfx(420+ai*55,.08);
  },420+i*760));

  t(()=>{ if(R1.phase!=='show') return; p1Input(); }, 420+R1.seq.length*760+620);
}

function p1Input(){
  R1.phase='input'; R1.input=[]; R1.tLeft=150; R1.tMax=150;
  $('#p1msg').innerHTML=`<b>Rodada ${R1.round}/${SIZES.length}</b> — Repita na <b>mesma ordem</b>! Há <b>${R1.seq.length}</b> animais.`;
  $('#p1seq').innerHTML=R1.seq.map((_,i)=>`<div class="seq-slot" id="ps${i}"></div>`).join('');
  $('#p1ok').classList.remove('hide');
  $('#p1timewrap').classList.remove('hide');
  p1Grid();
  p1Timer();
  p1StartClock();
}

let R1TIMER=null;
function p1Timer(){
  const w=$('#p1timewrap'), bar=$('#p1time');
  if(!bar) return;
  bar.style.width=(R1.tLeft/R1.tMax*100)+'%';
  w.classList.toggle('low', R1.tLeft<=45);
}
function p1StartClock(){
  if(R1TIMER) clearInterval(R1TIMER);
  R1TIMER=every(()=>{
    if(R1.phase!=='input'||S.phase!==1){ clearInterval(R1TIMER); R1TIMER=null; return; }
    R1.tLeft--;
    if(R1.tLeft<=0){ R1.tLeft=0; p1Timeout(); }
    else if(R1.tLeft===30) toast('⏰ 30 segundos!','warn');
    p1Timer();
  },1000);
}

function p1Timeout(){
  R1.phase='over';
  $$('#p1seq .seq-slot').forEach((s,i)=>{
    s.classList.add('miss');
    s.innerHTML=`<span class="se">${ANIMAIS[R1.seq[i]].e}</span>`;
  });
  loseLife('⏰ Tempo esgotado! A ordem correta era a mostrada no início.');
  R1.streak=0; p1StreakUI();
  if(S.lives>0) t(()=>{ if(S.phase===1){ $('#p1rev').classList.remove('hide'); $('#p1ok').classList.remove('hide'); } },700);
}

window.p1Rev=function(){
  R1.phase='show'; R1.input=[];
  t(()=>p1Show(),40);
};

window.p1Check=function(){
  if(R1.phase!=='input') return;
  R1.phase='check';
  const slots=$$('#p1seq .seq-slot');
  R1.input.forEach((v,i)=>{
    const s=slots[i]; if(!s) return;
    s.innerHTML=`<span class="se">${ANIMAIS[v].e}</span>`;
    s.classList.add(v===R1.seq[i]?'hit':'miss');
  });

  const ok=R1.input.length===R1.seq.length && R1.input.every((v,i)=>v===R1.seq[i]);
  if(ok){
    R1.streak++; R1.best=Math.max(R1.best,R1.streak);
    const timeBonus=Math.round(R1.tLeft/R1.tMax*60);
    const streakBonus=R1.streak*40;
    const pts=100+R1.seq.length*30+timeBonus+streakBonus;
    addScore(pts); sfxGood();
    $('#p1msg').innerHTML=`<b style="color:var(--green)">✅ Correto!</b> +${pts} pts (tempo +${timeBonus}, streak +${streakBonus})`;
    $('#p1ok').disabled=true;
    for(let i=0;i<SIZES.length;i++) $('#rd'+i).classList.toggle('on', i<R1.round);
    p1StreakUI();
    if(R1.round>=SIZES.length){
      if(R1.best===SIZES.length) addScore(150);
      t(()=>completePhase(1),1000);
    }else{
      t(()=>{ if(S.phase===1){ $('#p1ok').disabled=false; p1PickUI(); } },1500);
    }
  }else{
    R1.streak=0; p1StreakUI(); sfxBad();
    $('#p1msg').innerHTML='<b style="color:var(--red)">❌ Ordem incorreta!</b> Compare os slots verdes e vermelhos.';
    loseLife('❌ Ordem incorreta! Veja onde errou e tente de novo.');
    if(S.lives>0){
      t(()=>{ if(S.phase===1){ $('#p1ok').disabled=false; $('#p1rev').classList.remove('hide'); } },800);
    }
  }
};

function p1StreakUI(){
  $('#p1streak').innerHTML = R1.streak>1
    ? `🔥 STREAK x${R1.streak} — bônus de +${(R1.streak-1)*40} pts por rodada!`
    : '';
}

document.addEventListener('click',e=>{
  const el=e.target.closest('#p1grid .mem-animal'); if(!el) return;
  const i=+el.dataset.i;
  if(R1.phase==='pick'){ p1Click(i); return; }
  if(R1.phase==='input'){
    if(R1.input.length>=R1.seq.length) return;
    const cur=R1.input.length;
    R1.input.push(i);
    const s=$('#ps'+cur);
    el.classList.add('press'); t(()=>el.classList.remove('press'),260);
    sfx(560+i*40,.06);
    $('#p1msg').innerHTML=`Selecionados: <b>${R1.input.length}/${R1.seq.length}</b>`;
    if(R1.input.length===R1.seq.length) t(()=>p1Check(),430);
  }
});

  else msg.innerHTML='Senha fraca é achada em segundos. Senha forte leva <b>anos</b>.';

function p2Fmt(s){
  if(s>=31536000) return (s/31536000).toFixed(1)+' anos';
  if(s>=86400) return Math.round(s/86400)+' dias';
  if(s>=3600) return (s/3600).toFixed(1)+' horas';
  if(s>=60) return Math.round(s/60)+' minutos';
  return s+' segundos';
}

function p2StartHacker(){ clearInterval(R2.int); R2.hacking=false; }
function startHacking(){
  if(R2.hacking) return;
  R2.hacking=true; R2.hack=0;
  const total=p2Tempo();
  R2.int=setInterval(()=>{
    if(S.phase!==2||R2.step!==2||!R2.hacking){ clearInterval(R2.int); R2.hacking=false; return; }
    R2.hack=Math.min(100,R2.hack+100/total);
    const bar=$('#p2hack'); if(bar) bar.style.width=R2.hack+'%';
    const tb=$('#p2tleft'); if(tb) tb.textContent='~'+p2Fmt(Math.max(0,total*(1-R2.hack/100)));
    if(R2.hack>=100) p2Quebrada();
  },200);
}

/* ---------------------- DRAG & DROP (mouse + touch) ------------------ */
function bindDrag(){
  $$('[data-drag]').forEach(el=>{
    if(el._bound) return; el._bound=true;
    el.addEventListener('pointerdown',dragStart);
  });
}

function dragStart(e){
  const el=e.currentTarget;
  if(el.classList.contains('used')) return;
  const ghost=$('#ghost');
  const r=el.getBoundingClientRect();
  let moved=false;
  ghost.textContent=el.textContent.trim();
  ghost.classList.remove('hide');
  ghost.style.left=e.clientX+'px'; ghost.style.top=e.clientY+'px';
  el.style.opacity='.35';

  const move=ev=>{
    moved=true;
    ghost.style.left=ev.clientX+'px'; ghost.style.top=ev.clientY+'px';
    const z=zoneAt(ev.clientX,ev.clientY);
    $$('.slot,#profilePanel,#trashZone').forEach(x=>x.classList.remove('over'));
    if(z) z.classList.add('over');
  };
  const up=ev=>{
    document.removeEventListener('pointermove',move);
    document.removeEventListener('pointerup',up);
    ghost.classList.add('hide'); el.style.opacity='';
    $$('.slot,#profilePanel,#trashZone').forEach(x=>x.classList.remove('over'));
    const z=zoneAt(ev.clientX,ev.clientY);
    if(!z) return;
    const name=z.dataset.drop;
    if(S.phase===2) p2Drop(el.dataset.id,name,el);
    else if(S.phase===4) p4Drop(+el.dataset.n,name,el);
  };
  document.addEventListener('pointermove',move);
  document.addEventListener('pointerup',up);
  e.preventDefault();
}

function zoneAt(x,y){
  const stack=document.elementsFromPoint?document.elementsFromPoint(x,y):[document.elementFromPoint(x,y)];
  for(const n of stack){
    if(!n) continue;
    if(n.classList&&n.classList.contains('slot')) return n;
    if(n.id==='profilePanel'||n.id==='trashZone') return n;
  }
  return null;
}

    b.classList.toggle('done', found.includes(b.dataset.k));

window.p3Report=function(){
  const m=EMAILS[R3.idx];
  const achados=$$('#p3body .sign.found').map(e=>e.dataset.s);
  const total=m.signs.length;
  if(achados.length===0){ toast('Marque ao menos um sinal antes de denunciar','warn'); return; }

  const perfect=achados.length===total;
  const pts=achados.length*35+(perfect?80:0);
  addScore(pts);

  const hit=m.signs.filter(s=>achados.includes(s.k));
  const miss=m.signs.filter(s=>!achados.includes(s.k));
  const line=s=>`<div class="dline ${achados.includes(s.k)?'hit':'missed'}">
      <span style="font-size:1.05rem">${achados.includes(s.k)?'✅':'⚠️'}</span>
      <div><b>${SIGN_EMOJI[s.k]||''} ${s.t}</b>
        <span class="dsc">${s.d}</span></div></div>`;

  const last=R3.idx===R3.total-1;
  modal({
    emo:perfect?'🕵️':'🚨',
    title:perfect?'PHISHING IDENTIFICADO!':'DENÚNCIA ENVIADA',
    body:`Você encontrou <b>${achados.length} de ${total}</b> sinais · <b style="color:#2e7d3c">+${pts} pontos</b>
      <div class="debrief">
        ${hit.length?`<div class="dh">✅ SINAIS QUE VOCÊ ENCONTROU (${hit.length})</div>`:''}
        ${hit.map(line).join('')}
        ${miss.length?`<div class="dh">⚠️ SINAIS QUE FICARAM PARA TRÁS (${miss.length})</div>`:''}
        ${miss.map(line).join('')}
      </div>`,
    btns:[{t: last?'▶ Concluir fase':'Próximo e-mail ▶', cls:'btn primary', act:()=>{
      if(last) completePhase(3); else { R3.idx++; p3Load(); }
    }}]
  });
  if(perfect) confetti();
  sfxGood();
};

let G=null;
function initGame(){
  const cv=$('#cv'), ctx=cv.getContext('2d');
  G={
    cv,ctx,W:cv.width,H:cv.height,raf:0,last:0,
    player:{x:cv.width/2,y:cv.height-46,w:34,h:30,spd:5.4,hp:3,maxhp:3,
            shield:false,dash:0,dashCd:0,dashT:0,invul:0,trail:[]},
    bullets:[],ebul:[],enemies:[],parts:[],floats:[],drops:[],
    kills:0,goal:20,wave:1,combo:0,comboT:0,shields:3,
    pw:{},                 // power-ups ativos {tri:tempo,...}
    keys:{},fire:false,lastShot:0,spawn:60,running:true,shake:0,
    boss:null,bossSpawned:0,
    stars:Array.from({length:80},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,s:Math.random()*1.6+.3,sp:Math.random()*.7+.15})),
    spawnRate:88,maxAlive:4
  };
  window.addEventListener('keydown',onKeyDown);
  window.addEventListener('keyup',onKeyUp);
  bindPads();
  updHUD();                       // desenha casco, escudo e dash já no início
  cancelAnimationFrame(G.raf);
  G.last=performance.now();
  G.raf=requestAnimationFrame(loop);
}

function onKeyDown(e){
  if(S.phase!==5||!G||!G.running) return;
  const k=e.key.toLowerCase();
  if(k==='shift'&&!e.repeat) toggleDash();
  G.keys[k]=true;
  if([' ','arrowleft','arrowright','a','d','shift'].includes(k)) e.preventDefault();
}
function onKeyUp(e){ if(S.phase===5&&G) G.keys[e.key.toLowerCase()]=false; }

function bindPads(){
  $$('.padbtn').forEach(b=>{
    if(b._b) return; b._b=true;
    const k=b.dataset.key;
    b.addEventListener('pointerdown',ev=>{
      ev.preventDefault();
      if(k==='fire') G.fire=true;
      else if(k==='shield') toggleShield();
      else if(k==='dash') toggleDash();
      else G.keys[k]=true;
    });
    const off=()=>{ if(k!=='fire'&&k!=='shield'&&k!=='dash') G.keys[k]=false; };
    b.addEventListener('pointerup',off);
    b.addEventListener('pointerleave',off);
    b.addEventListener('pointercancel',off);
  });
}

/* ---------------- escudo e dash ---------------- */
function toggleShield(){
  if(!G||!G.running) return;
  if(G.player.shield) return toast('🛡️ Escudo já está ativo!','warn');
  if(G.shields<=0) return toast('❌ Sem escudos!','warn');
  G.shields--; G.player.shield=true; G.player.invul=Math.max(G.player.invul,120);
  sfx(320,.2,'triangle',.05); updHUD();
  toast('🛡️ Escudo ativo! Absorve o próximo impacto.','good');
}

function toggleDash(){
  if(!G||!G.running) return;
  const p=G.player;
  if(p.dashCd>0) return toast('💨 Dash recarregando…','warn');
  p.dashCd=150;
  p.dashT=11; p.dash=1;
  p.invul=Math.max(p.invul,18);       // dash dá invulnerabilidade breve
  sfx(880,.12,'sawtooth',.035);
  ftext(p.x,p.y-30,'💨','#00f0ff');
}

function updHUD(){
  const b=$('#shieldBtn'); if(b&&G){
    b.textContent=G.player.shield?'🛡️ ATIVO':`🛡️ Escudo (${G.shields})`;
    b.classList.toggle('act',G.player.shield);
  }
  const d=$('#gDash');
  if(d&&G){
    const pct=G.player.dashCd>0 ? (1-G.player.dashCd/150)*100 : 100;
    d.querySelector('i').style.width=pct+'%';
    d.classList.toggle('ready',G.player.dashCd<=0);
  }
  const hp=$('#gHp');
  if(hp&&G){
    hp.innerHTML=Array.from({length:G.player.maxhp},(_,i)=>
      `<span class="hpdot ${i<G.player.hp?'':'off'}"></span>`).join('');
  }
  const pw=$('#gPw');
  if(pw&&G){
    pw.innerHTML=Object.keys(G.pw).filter(k=>G.pw[k]>0).map(k=>{
      const def=POWERUPS.find(p=>p.id===k);
      return `<span class="pwslot" style="border-color:${def.col};color:${def.col}">
        ${def.e} ${def.t} ${(G.pw[k]/1000).toFixed(1)}s</span>`;
    }).join('');
  }
}

/* ---------------- inimigos ---------------- */
function spawnEnemy(){
  const boost=Math.min(3,Math.floor(G.kills/6));
  const pool=ENEMY_TYPES.filter(t=>!(G.wave<2&&t.t==='spyware'));
  let t=Math.random()<0.12+boost*0.10 ? ENEMY_TYPES[3] : rnd(pool);
  const scale=1+boost*0.15;
  const hp=Math.max(1,Math.ceil(t.hp*scale));
  G.enemies.push({
    x:30+Math.random()*(G.W-60), y:-40,
    e:t.e,t:t.t,hp,maxhp:hp,pts:t.pts,move:t.move,
    vy:0.85+boost*0.28+Math.random()*0.5,
    vx:(Math.random()-0.5)*1.3, base:30+Math.random()*(G.W-60), ph:Math.random()*6,
    r:17, shot:ri(60,140), fires:t.fires||0
  });
}

/* chefe: aparece a cada 10 eliminações */
function spawnBoss(){
  if(G.boss) return;
  G.bossSpawned++;
  G.boss={
    x:G.W/2, y:-60, hp:26+G.wave*6, maxhp:26+G.wave*6,
    e:'🧟', t:'boss', hp0:0, r:40, ph:0, shot:70, rage:false
  };
  G.boss.maxhp=26+G.wave*6; G.boss.hp=G.boss.maxhp;
  G.spawn=200; G.maxAlive=2;
  const bb=$('#gBoss'); if(bb){ bb.classList.add('on'); $('#gBossT').textContent='🧟 CHEFE — VÍRUSO SUPREMO'; }
  waveBanner('⚠️ CHEFE!');
  toast('🧟 Um vírus supremo apareceu!','warn');
  sfx(140,.5,'sawtooth',.07);
}

/* ---------------- efeitos ---------------- */
function boom(x,y,color='#00f0ff',n=10){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=1+Math.random()*3.2;
    G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:30,color});
  }
}
function ftext(x,y,txt,c='#ffd93d'){ G.floats.push({x,y,t:txt,c,life:42}); }

function dropPowerup(x,y){
  if(Math.random()>0.16) return;
  const def=rnd(POWERUPS);
  G.drops.push({x,y,e:def.e,id:def.id,dur:def.dur,col:def.col,ph:Math.random()*6});
}

/* ---------------- loop ---------------- */
function loop(ts){
  if(!G||S.phase!==5) return;
  G.raf=requestAnimationFrame(loop);
  const dt=Math.min(2.6,(ts-G.last)/16.67||1);
  G.last=ts;
  if(G.running) update(dt);
  draw();
}

function update(dt){
  const p=G.player;

  /* --- movimento + dash --- */
  if(p.dashT>0) p.dashT-=dt;
  if(p.dashCd>0) p.dashCd-=dt;
  const speed=p.spd*(p.dashT>0?2.6:1);
  const left=G.keys.arrowleft||G.keys.a, right=G.keys.arrowright||G.keys.d;
  if(left&&!right)  p.x-=speed*dt;
  if(right&&!left) p.x+=speed*dt;
  p.x=Math.max(p.w/2,Math.min(G.W-p.w/2,p.x));

  if(p.invul>0) p.invul-=dt;
  p.trail.unshift({x:p.x,y:p.y});
  if(p.trail.length>10) p.trail.pop();

  /* --- power-ups ativos --- */
  for(const k of Object.keys(G.pw)){ G.pw[k]-=dt; if(G.pw[k]<=0) delete G.pw[k]; }

  /* --- tiro --- */
  const now=performance.now();
  const rate=G.pw.rap?90:160;
  if((G.fire||G.keys[' ']) && now-G.lastShot>rate){
    G.lastShot=now;
    if(G.pw.tri){
      G.bullets.push({x:p.x,y:p.y-18,vx:0,vy:-7.6,pier:!!G.pw.pier});
      G.bullets.push({x:p.x-13,y:p.y-10,vx:-3.1,vy:-6.8,pier:!!G.pw.pier});
      G.bullets.push({x:p.x+13,y:p.y-10,vx:3.1,vy:-6.8,pier:!!G.pw.pier});
    }else{
      G.bullets.push({x:p.x-9,y:p.y-18,vx:0,vy:-7.6,pier:!!G.pw.pier});
      G.bullets.push({x:p.x+9,y:p.y-18,vx:0,vy:-7.6,pier:!!G.pw.pier});
    }
    sfxShot();
  }

  /* --- spawn --- */
  G.spawn-=dt;
  if(!G.boss && G.spawn<=0 && G.enemies.length<G.maxAlive+Math.min(4,G.wave-1)){
    spawnEnemy();
    G.spawn=G.spawnRate-Math.min(40,G.wave*6);
  }

  /* --- chefe nos marcos --- */
  if(!G.boss && !G.bossSpawnedAt && G.kills>=10 && G.kills<G.goal){
    G.bossSpawnedAt=true; spawnBoss();
  }

  /* --- partículas / textos --- */
  for(const q of G.parts){ q.x+=q.vx*dt; q.y+=q.vy*dt; q.life-=dt; }
  G.parts=G.parts.filter(q=>q.life>0);
  for(const f of G.floats){ f.y-=0.6*dt; f.life-=dt; }
  G.floats=G.floats.filter(f=>f.life>0);
  if(G.comboT>0){ G.comboT-=dt; if(G.comboT<=0) G.combo=0; }
  if(G.shake>0) G.shake-=dt;

  /* --- drops de power-up --- */
  for(const d of G.drops){
    d.y+=1.5*dt; d.ph+=0.08*dt; d.x+=Math.sin(d.ph)*1.2*dt;
    if(Math.abs(d.x-p.x)<22 && Math.abs(d.y-p.y)<22){ d.gone=true; grabPowerup(d); }
  }
  G.drops=G.drops.filter(d=>!d.gone && d.y<G.H+20);

  /* --- balas do jogador (com perfuração) --- */
  for(const b of G.bullets){
    b.y+=b.vy*dt; b.x+=b.vx*dt;
    if(b.x<-20||b.x>G.W+20){ b.dead=true; continue; }
    if(G.boss && !b.dead){
      if(Math.abs(b.x-G.boss.x)<G.boss.r && Math.abs(b.y-G.boss.y)<G.boss.r){
        G.boss.hp--; b.dead=!b.pier;
        boom(b.x,b.y,'#ffd93d',4); sfx(320,.04,'square',.018);
        $('#gBossB') && ($('#gBossB').style.width=(G.boss.hp/G.boss.maxhp*100)+'%');
        if(G.boss.hp<=0) killBoss();
      }
    }
    if(b.dead) continue;
    for(const en of G.enemies){
      if(Math.abs(b.x-en.x)<en.r && Math.abs(b.y-en.y)<en.r){
        en.hp--; b.dead=!b.pier;
        boom(b.x,b.y,'#ffd93d',4); sfx(320,.04,'square',.018);
        if(en.hp<=0) kill(en);
        if(b.dead) break;
      }
    }
  }
  G.bullets=G.bullets.filter(b=>!b.dead && b.y>-14 && b.x>-20 && b.x<G.W+20);

  /* --- balas inimigas --- */
  for(const b of G.ebul){ b.y+=3.4*dt; b.x+=(b.vx||0)*dt; }
  for(const b of G.ebul){
    if(Math.abs(b.x-p.x)<17 && Math.abs(b.y-p.y)<19 && p.invul<=0){ b.dead=true; hit(); }
  }
  G.ebul=G.ebul.filter(b=>!b.dead && b.y<G.H+12);

  /* --- inimigos --- */
  for(const en of G.enemies){
    en.ph+=0.09*dt;
    if(en.move==='zigzag')   { en.y+=en.vy*dt; en.x=en.base+Math.sin(en.ph*2.2)*46; }
    else if(en.move==='sine'){ en.y+=en.vy*1.15*dt; en.x=en.base+Math.sin(en.ph)*72; }
    else                     { en.y+=en.vy*dt; en.x+=en.vx*dt; }
    if(en.x<en.r) { en.x=en.r; en.vx=Math.abs(en.vx); }
    if(en.x>G.W-en.r){ en.x=G.W-en.r; en.vx=-Math.abs(en.vx); }
    if(en.fires && en.y>0 && en.y<G.H-90){
      en.shot-=dt;
      if(en.shot<=0){ en.shot=ri(70,170)/en.fires; G.ebul.push({x:en.x,y:en.y+15}); }
    }
    if(Math.abs(en.x-p.x)<en.r+p.w/2 && Math.abs(en.y-p.y)<en.r+p.h/2 && p.invul<=0){
      en.gone=true; hit(true,en);
    }
    if(en.y>G.H+36) en.gone=true;
  }
  G.enemies=G.enemies.filter(e=>!e.gone);

  /* --- chefe --- */
  if(G.boss){
    const b=G.boss;
    b.ph+=0.05*dt;
    b.x=Math.max(b.r,Math.min(G.W-b.r, b.x+Math.sin(b.ph)*2.4));
    b.y+=Math.min(1.2,Math.max(0.35,(-40-b.y)*0.02+0.9))*dt;
    b.shot-=dt;
    if(b.shot<=0 && b.y>10){
      b.shot=b.hp<b.maxhp/2?52:110;
      const ang=Math.atan2(p.y-b.y,p.x-b.x);
      G.ebul.push({x:b.x,y:b.y+20,vx:Math.cos(ang)*2.9});
      if(b.hp<b.maxhp/2) G.ebul.push({x:b.x-22,y:b.y+10,vx:Math.cos(ang-0.4)*2.6});
    }
    if(Math.abs(b.x-p.x)<b.r+p.w/2 && Math.abs(b.y-p.y)<b.r+p.h/2 && p.invul<=0) hit(true,b);
  }

  hudGame();
}

/* ---------------- power-ups ---------------- */
function grabPowerup(d){
  const def=POWERUPS.find(x=>x.id===d.id);
  sfx(900,.1,'triangle',.05);
  ftext(p().x,p().y-32,def.t,def.col);
  if(d.dur>0){ G.pw[d.id]=d.dur; toast(`${def.e} ${def.t} ativado!`,'good'); }
  else if(d.id==='shield'){ G.player.shield=true; G.player.invul=Math.max(G.player.invul,120); toast('🛡️ Escudo coletado!','good'); }
  else if(d.id==='vida'){
    if(G.player.hp<G.player.maxhp){ G.player.hp++; toast('❤️ Vida recuperada!','good'); }
    else { S.lives=Math.min(S.maxLives,S.lives+1); hud(); toast('❤️ Vida extra conquistada!','good'); }
  }
  updHUD();
}
function p(){ return G.player; }

/* ---------------- mortes ---------------- */
function kill(en){
  en.gone=true; G.kills++; G.combo++; G.comboT=120;
  const mult=1+Math.floor((G.combo-1)/3)*0.5;
  const pts=Math.round(en.pts*mult);
  addScore(pts);
  ftext(en.x,en.y,`+${pts}`,mult>1?'#ff3ea5':'#25f4a7');
  boom(en.x,en.y,mult>1?'#ff3ea5':'#25f4a7',16);
  dropPowerup(en.x,en.y);
  G.shake=4;
  sfxBoom();
  if(en.t==='bug'){ // divide em dois vírus
    for(let i=0;i<2;i++){
      G.enemies.push({x:en.x+(i?12:-12),y:en.y,e:'🦠',t:'virus',hp:1,maxhp:1,pts:10,
        move:'straight',vy:1.3,vx:(i?0.8:-0.8),base:en.x,ph:0,r:14,shot:999,fires:0});
    }
  }
  if(G.kills%6===0 && G.kills<G.goal){
    G.wave++;
    waveBanner('ONDA '+G.wave);
    G.maxAlive=Math.min(7,G.maxAlive+1);
    toast(`🌊 Onda ${G.wave} — mais inimigos e mais rápidos!`,'warn');
  }
  if(G.kills>=G.goal) winGame();
}

function killBoss(){
  const b=G.boss; if(!b) return;
  G.boss=null;
  boom(b.x,b.y,'#ff3ea5',42); boom(b.x,b.y,'#00f0ff',28);
  G.shake=12;
  G.kills+=5;
  addScore(300);
  ftext(b.x,b.y,'CHEFE! +300','#ffd93d');
  dropPowerup(b.x,b.y);
  const bb=$('#gBoss'); if(bb){ bb.classList.remove('on'); $('#gBossB').style.width='0%'; }
  G.maxAlive=4;
  sfxGood(); confetti();
  toast('🧟👾 CHEFE DERROTADO! +5 eliminações','good');
  if(G.kills>=G.goal) winGame();
}

function hit(isRam,en){
  const p=G.player;
  const x=(isRam&&en)?en.x:p.x, y=(isRam&&en)?en.y:p.y;
  if(p.shield){
    G.enemies = G.enemies.filter(e=>e!==en);
    boom(x,y,'#a855f7',16);
    p.shield=false; p.invul=140;
    updHUD(); sfxBad();
    toast('🛡️ O escudo absorveu o golpe!','warn');
    return;
  }
  boom(x,y,'#ff3b5c',18);
  G.shake=8;
  p.invul=110;
  p.hp--;
  G.combo=0;
  if(p.hp>0){
    sfxBad();
    toast(`💔 Casco danificado! Restam ${p.hp} de ${p.maxhp}.`,'bad');
    updHUD();
    return;
  }
  // nave destruída: renasce no centro com o casco cheio
  p.hp=p.maxhp;
  p.x=G.W/2;
  p.y=G.H-46;
  p.trail.length=0;
  p.invul=170;
  p.shield=false;
  G.enemies.length=Math.min(G.enemies.length,2);
  G.ebul.length=0;
  updHUD();
  loseLife('💔 Sua nave foi destruída! Casco restaurado.');
}

function hudGame(){
  const k=$('#gKill'),c=$('#gCombo'),w=$('#gWave');
  if(!k) return;
  k.textContent=`${G.kills}/${G.goal}`;
  c.textContent='x'+(G.combo>2?G.combo:0);
  w.textContent=G.wave;
  updHUD();
}

function waveBanner(txt){
  const b=document.createElement('div');
  b.className='wavebanner'; b.textContent=txt;
  $('#gameWrap').appendChild(b);
  t(()=>b.remove(),1800);
}

/* ---------------- desenho ---------------- */
function draw(){
  const {ctx,W,H}=G, p=G.player;          // p = nave do jogador (G.player)
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(G.shake>0) ctx.translate((Math.random()-.5)*5,(Math.random()-.5)*5);

  /* estrelas com parallax */
  for(const st of G.stars){
    ctx.fillStyle='rgba(180,210,255,.5)';
    ctx.fillRect(st.x,st.y,st.s,st.s);
    st.y+=st.sp*(G.pw.rap?1.8:1);
    if(st.y>H){ st.y=-2; st.x=Math.random()*W; }
  }

  ctx.fillStyle='rgba(168,85,247,.10)'; ctx.fillRect(0,0,W,32);
  ctx.font='11px sans-serif'; ctx.fillStyle='rgba(200,220,255,.6)';
  ctx.fillText('ZONA PROTEGIDA', 8, 20);

  /* rastro do dash */
  ctx.save();
  for(let i=1;i<p.trail.length;i++){
    const tr=p.trail[i];
    ctx.globalAlpha=0.22*(1-i/p.trail.length);
    ctx.fillStyle='#00f0ff'; ctx.font='22px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🚀',tr.x,tr.y);
  }
  ctx.restore();

  const blink=p.invul>0 && Math.floor(p.invul/4)%2===0;
  if(!blink){
    ctx.save();
    ctx.shadowBlur=18; ctx.shadowColor='#00f0ff';
    ctx.font='26px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🚀',p.x,p.y);
    ctx.restore();
  }
  if(p.shield){
    ctx.save(); ctx.shadowBlur=20; ctx.shadowColor='#a855f7';
    ctx.strokeStyle='rgba(168,85,247,.9)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(p.x,p.y,26,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  if(p.dashT>0){
    ctx.save(); ctx.strokeStyle='rgba(0,240,255,.55)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(p.x,p.y,30,0,Math.PI*2); ctx.stroke(); ctx.restore();
  }

  /* power-ups no chão */
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const d of G.drops){
    const pulse=1+Math.sin(d.ph*2)*0.12;
    ctx.save(); ctx.shadowBlur=14; ctx.shadowColor=d.col;
    ctx.font=(22*pulse)+'px sans-serif'; ctx.fillText(d.e,d.x,d.y);
    ctx.restore();
  }

  /* balas */
  ctx.save();
  ctx.shadowBlur=12; ctx.fillStyle='#ffd93d';
  for(const b of G.bullets){ ctx.beginPath(); ctx.arc(b.x,b.y,3.4,0,Math.PI*2); ctx.fill(); }
  ctx.shadowColor='#ff3ea5'; ctx.fillStyle='#ff3ea5';
  for(const b of G.ebul){ ctx.beginPath(); ctx.arc(b.x,b.y,4.2,0,Math.PI*2); ctx.fill(); }
  ctx.restore();

  /* inimigos */
  for(const en of G.enemies){
    ctx.font=(en.maxhp>2?'30px':'26px')+' sans-serif';
    ctx.fillText(en.e,en.x,en.y);
    if(en.maxhp>1){
      ctx.fillStyle='rgba(255,255,255,.2)'; ctx.fillRect(en.x-14,en.y-22,28,3);
      ctx.fillStyle='#ff3b5c'; ctx.fillRect(en.x-14,en.y-22,28*(en.hp/en.maxhp),3);
    }
  }

  /* chefe */
  if(G.boss){
    const b=G.boss;
    ctx.save(); ctx.shadowBlur=24; ctx.shadowColor='#ff3b5c';
    ctx.font='54px sans-serif'; ctx.fillText('🧟',b.x,b.y); ctx.restore();
  }

  /* partículas e textos */
  ctx.save();
  for(const q of G.parts){ ctx.globalAlpha=Math.max(0,q.life/30); ctx.fillStyle=q.color; ctx.fillRect(q.x,q.y,2.6,2.6); }
  ctx.font='bold 13px sans-serif';
  for(const f of G.floats){ ctx.globalAlpha=Math.max(0,f.life/42); ctx.fillStyle=f.c; ctx.fillText(f.t,f.x,f.y); }
  ctx.restore();

  ctx.restore();
}

/* ---------------- fim de jogo ---------------- */
function winGame(){
  G.running=false;
  cancelAnimationFrame(G.raf);
  const bonus=300+S.lives*60+G.player.hp*40;
  addScore(bonus);
  sfxGood(); confetti();
  const ov=$('#overlayC');
  ov.classList.remove('hide');
  ov.innerHTML=`<div>
    <div style="font-size:3rem">🚀</div>
    <div class="t">MISSÃO CUMPRIDA!</div>
    <div class="muted">Você protegeu a internet de ${G.kills} ameaças!<br>
      Bônus final: <b style="color:var(--cyan)">+${bonus}</b> pts</div>
    <div class="btn-row"><button class="btn primary" onclick="completePhase(5)">▶ Ver resultado</button></div>
  </div>`;
}

function gameOverScreen(){
  G.running=false;
  cancelAnimationFrame(G.raf);
  const ov=$('#overlayC');
  ov.classList.remove('hide');
  ov.innerHTML=`<div>
    <div style="font-size:3rem">💥</div>
    <div class="t" style="color:var(--red);text-shadow:0 0 18px var(--red)">INVASÃO!</div>
    <div class="muted">Você eliminou ${G.kills} de ${G.goal} ameaças.<br>Os vírus dominaram!</div>
    <div class="btn-row"><button class="btn primary" onclick="p5()">↺ Tentar de novo</button></div>
  </div>`;
}

/* sem vidas na fase 5 -> game over */
(function(){
  const orig=loseLife;
  loseLife=function(msg){
    const before=S.lives;
    orig(msg);
    if(S.phase===5 && G && before>0 && S.lives<=0){ closeModal(); gameOverScreen(); }
  };
})();

/* =============================== FINAL ============================== */

              g2:'🥈 AGENTE DE ELITE',
              g3:'🥉 APRENDIZ EM TREINO'}[cls];

  screen(HUD+`
  <div class="panel center">
    <div style="font-size:4rem;animation:float 2.5s infinite">🎉</div>
    <h1 style="font-size:clamp(1.7rem,6vw,2.6rem);letter-spacing:2px;
      background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink));
      -webkit-background-clip:text;background-clip:text;color:transparent">MISSÃO COMPLETA!</h1>
    <div class="rank ${cls}">${rank}</div>

    <div class="stats">
      <div class="stat"><div class="v">${S.score}</div><div class="k">Pontuação</div></div>
      <div class="stat"><div class="v">${S.lives>0?'❤️'.repeat(S.lives):'0'}</div><div class="k">Vidas Restantes</div></div>
      <div class="stat"><div class="v">${done}/${TOTAL}</div><div class="k">Fases Concluídas</div></div>
    </div>

    <h3 style="margin-top:20px;color:var(--cyan);font-size:1rem">💡 Dicas de Segurança Digital</h3>

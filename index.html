<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Minhas Tarefas</h1>
      <p>Organize o seu dia de forma simples</p>
    </header>

    <form id="task-form">
      <input type="text" id="task-input" placeholder="Adicionar uma nova tarefa..." autocomplete="off" required>
      <button type="submit" id="add-btn">Adicionar</button>
    </form>

    <div class="filter-container">
      <button class="filter-btn active" data-filter="all">Todas</button>
      <button class="filter-btn" data-filter="pending">Pendentes</button>
      <button class="filter-btn" data-filter="completed">Concluídas</button>
    </div>

    <ul id="task-list"></ul>

    <div class="footer">
      <span id="task-count">0 tarefas pendentes</span>
      <button id="clear-completed">Limpar Concluídas</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
